apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: kube-system
spec:
  chart: oci://quay.io/jetstack/charts/cert-manager
  version: v1.21.3
  targetNamespace: cert-manager
  valuesContent: |
    crds:
      enabled: true
    config:
      gatewayAPI:
        enabled: true
    nodeSelector: &id001
      hapbang.io/pool: app-observe
    resources:
      requests:
        cpu: 50m
        memory: 50Mi
      limits:
        memory: 50Mi
    webhook:
      nodeSelector: *id001
      resources:
        requests:
          cpu: 50m
          memory: 50Mi
        limits:
          memory: 50Mi
    cainjector:
      nodeSelector: *id001
      resources:
        requests:
          cpu: 50m
          memory: 50Mi
        limits:
          memory: 50Mi
    startupapicheck:
      nodeSelector: *id001
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 64Mi
