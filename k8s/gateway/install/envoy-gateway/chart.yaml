apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: envoy-gateway
  namespace: kube-system
spec:
  chart: oci://docker.io/envoyproxy/gateway-helm
  version: v1.9.3
  targetNamespace: envoy-gateway-system
  valuesContent: |
    deployment:
      envoyGateway:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 128Mi
      pod:
        nodeSelector: &id001
          hapbang.io/pool: app-observe
    certgen:
      job:
        nodeSelector: *id001
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 64Mi
    config:
      envoyGateway:
        extensionApis:
          enableLua: true
