apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: hapbang-platform
spec:
  parentRefs:
  - name: hapbang
    namespace: envoy-gateway-system
    sectionName: https
  rules:
  - matches:
    - path:
        type: Exact
        value: /grafana
    filters:
    - type: RequestRedirect
      requestRedirect:
        path:
          type: ReplaceFullPath
          replaceFullPath: /grafana/
        statusCode: 301
  - matches:
    - path:
        type: PathPrefix
        value: /grafana/
    backendRefs:
    - name: grafana
      port: 80
