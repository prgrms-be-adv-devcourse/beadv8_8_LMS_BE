apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: gateway-staging
spec:
  acme:
    email: replace-before-apply@example.invalid
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: gateway-staging-account
    solvers:
    - http01:
        gatewayHTTPRoute:
          parentRefs:
          - name: hapbang
            namespace: envoy-gateway-system
            kind: Gateway
            sectionName: http
