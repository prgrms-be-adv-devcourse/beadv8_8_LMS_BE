apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: grafana
  namespace: hapbang-platform
spec:
  valuesContent: |
    grafana.ini:
      server:
        root_url: https://hapbang.duckdns.org/grafana/
        serve_from_sub_path: true
      auth.anonymous:
        enabled: false
      auth.proxy:
        enabled: false
      auth.basic:
        enabled: true
      users:
        allow_sign_up: false
      security:
        cookie_secure: true
        cookie_samesite: lax
      # Grafana 자체 지표(/metrics, /metrics/plugins/*)는 인증이 없어 /grafana/ route로 공개됐다. Prometheus가 수집하지
      # 않으므로 끈다(#940). 다시 켜려면 basic auth나 route 차단을 함께 둔다(docs/deploy/gateway.md).
      metrics:
        enabled: false
    deploymentStrategy:
      type: Recreate
    readinessProbe:
      httpGet:
        path: /grafana/api/health
        port: 3000
      timeoutSeconds: 5
    livenessProbe:
      httpGet:
        path: /grafana/api/health
        port: 3000
      initialDelaySeconds: 60
      timeoutSeconds: 5
      failureThreshold: 10
    startupProbe:
      httpGet:
        path: /grafana/api/health
        port: 3000
      periodSeconds: 5
      failureThreshold: 60
      timeoutSeconds: 5
    # 384Mi에서 운영 3일 최대 working set 374Mi(97%)라 448Mi로 올렸다(#532)
    # 448Mi에서 운영 7일 최대 418Mi(93%), GOMEMLIMIT(limit의 90%, 403MiB)을 넘어 512Mi로 올렸다(#608)
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 512Mi
    env:
      GOMAXPROCS: '2'
