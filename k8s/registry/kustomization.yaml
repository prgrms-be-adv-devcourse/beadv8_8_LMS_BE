# GHCR pull 인증(#460). GHCR 패키지는 조직 정책으로 private이다.
# hapbang-prod의 ghcr-pull Secret 하나를 BE 앱 6개(prod overlay)와 FE web이 imagePullSecrets로 참조한다.
# 앱·FE 배포는 이 Secret을 만들거나 지우지 않는다. 처음 한 번과 토큰 교체 때만 손으로 적용한다(docs/deploy/k8s.md "GHCR pull 인증").
# ghcr-pull.yaml은 k8s/tools/seal-ghcr-pull.sh로 만든다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ghcr-pull.yaml
