# Kafka 토픽·메시지·consumer group을 보는 UI(Redpanda Console, Apache Kafka와 호환).
# 평소에는 replicas 0으로 꺼 두고, 볼 때만 켜서 port-forward로 접속한다(docs/deploy/k8s.md "관측성 접속").
# 자체 로그인과 권한 제어가 없고 메시지 발행·토픽 삭제도 할 수 있다. 외부에서는 Gateway의 /kafka/ route가 Basic Auth로 막는다(k8s/gateway/base/kafka-ui-route.yaml).
# Kafdrop(JVM)은 로컬 실측 269~307Mi, Redpanda Console(Go)은 35~42Mi라 이쪽을 골랐다(#374). 라이선스는 BSL이며 내부 사용은 허용된다.
apiVersion: v1
kind: Service
metadata:
  name: redpanda-console
  labels:
    app.kubernetes.io/name: redpanda-console
spec:
  selector:
    app.kubernetes.io/name: redpanda-console
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-console
  labels:
    app.kubernetes.io/name: redpanda-console
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda-console
    spec:
      # 관측성 도구라 medium에 둔다(docs/deploy/aws-k3s.md).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: hapbang.io/pool
                    operator: In
                    values: [app-observe]
      containers:
        - name: console
          image: docker.redpanda.com/redpandadata/console:v3.13.1
          env:
            - name: KAFKA_BROKERS
              value: kafka.hapbang-platform.svc.cluster.local:9092
            # 기본값은 브라우저에서 외부 분석 스크립트(Hubspot)를 불러온다. 끈다.
            - name: ANALYTICS_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /admin/health
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
