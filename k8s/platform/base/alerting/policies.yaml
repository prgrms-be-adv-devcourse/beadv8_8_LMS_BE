# 통보 규칙(#781). 이 파일이 통보 규칙 tree 전체를 덮어쓴다. 모든 alert를 Slack 하나로 보낸다.
# - group_by: 같은 alert의 여러 instance(앱·pod·규칙)를 메시지 하나로 묶는다.
# - group_wait 30s: 처음 울린 뒤 같은 묶음을 30초 모아 보낸다. group_interval 5m: 묶음에 새 instance가 생기면 5분 뒤 다시 보낸다.
# - repeat_interval 4h: 해결되지 않은 alert는 4시간마다 다시 보낸다. 복구되면 contact point가 복구 통보를 보낸다.
apiVersion: 1
policies:
  - orgId: 1
    receiver: slack
    group_by: ['grafana_folder', 'alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
