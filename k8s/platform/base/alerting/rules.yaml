# Grafana alert rule(#781). 정책과 alert마다의 조건·대응은 docs/architecture/infrastructure/observability.md "Alert 정책"(#629)이다.
# 이 파일이 원본이다. provisioning된 rule은 Grafana UI에서 고칠 수 없다. 고친 뒤 Grafana를 다시 띄워야 읽는다(같은 문서 "적용").
# - 각 rule은 A(Prometheus instant query)의 series마다 C(threshold)로 판정한다. 조건에 맞지 않는 series는 Normal이다.
# - 지표가 없으면(NoData) OK로 둔다. pod가 내려가 지표가 사라진 것은 잡지 못한다(kube-state-metrics 없음, 같은 문서 "Dashboard").
# - 쿼리가 실패하면(Prometheus 장애) Error로 두어 DatasourceError alert로 받는다.
# - annotation은 환경 변수로 바꾸지 않으므로 Grafana template의 $labels·$values를 그대로 쓴다.
apiVersion: 1
groups:
  - orgId: 1
    name: 돈·HP 정합성
    folder: 합방 alert
    interval: 1m
    rules:
      # 마지막으로 끝까지 비교한 실행의 규칙별 건수(gauge). 다음 실행이 끝날 때까지 값이 남는다.
      - uid: hapbang-hp-reconciliation-mismatch
        title: 서비스 간 HP 대사 불일치
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                max by (app_kubernetes_io_name, rule) (
                  {__name__=~"(lecture|appearance)_hp_reconciliation_mismatches"}
                )
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ $labels.app_kubernetes_io_name }} HP 대사 규칙 {{ $labels.rule }}에서 {{ humanize $values.A.Value }}건이 어긋났다.'
          description: >-
            마지막으로 끝까지 비교한 대사 결과다. HP_TASK_DEAD는 어긋남이 아니라 DEAD 작업 때문에 비교하지 않은 건수다(관리자 HP 작업 화면에서 재시도).
            어긋난 건은 Loki {namespace="hapbang-prod", app="{{ $labels.app_kubernetes_io_name }}"} |= "rule={{ $labels.rule }}"로 찾는다.
            고치지 않으면 다음 대사(매일 새벽)까지 다시 보낸다.

      # 마지막 잔액 대사의 결과별 지갑 수(gauge). failed는 재시도 뒤에도 대사하지 못한 지갑이다.
      - uid: hapbang-wallet-reconciliation-mismatch
        title: 지갑 잔액 대사 불일치·실패
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                max by (app_kubernetes_io_name, result) (
                  hapbang_billing_reconciliation_wallets{result=~"mismatched|failed"}
                )
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '지갑 잔액 대사에서 {{ $labels.result }} 지갑이 {{ humanize $values.A.Value }}개다.'
          description: >-
            mismatched는 잔액과 원장이 어긋난 지갑, failed는 재시도 뒤에도 대사하지 못한 지갑이다.
            Loki {namespace="hapbang-prod", app="billing-app"} |= "잔액 대사"로 walletId와 bucket별 차이를 찾는다(docs/billing/module.md).
            불일치는 자동으로 고치지 않는다.

      # 출연: 재시도 배치 시점의 DEAD 작업 수(gauge, 처리될 때까지 남는다).
      # 강의: DEAD가 된 횟수(counter)라 최근 10분에 늘었을 때만 보낸다. 남은 DEAD는 위 대사 alert의 HP_TASK_DEAD가 매일 알린다.
      - uid: hapbang-hp-task-dead
        title: HP 작업 DEAD
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                max by (app_kubernetes_io_name) (appearance_hp_task_dead)
                or
                sum by (app_kubernetes_io_name) (increase(lecture_hp_task_dead_total[10m]))
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ $labels.app_kubernetes_io_name }} HP 작업이 DEAD가 됐다({{ humanize $values.A.Value }}).'
          description: >-
            재시도 한도를 넘었거나 다시 보내도 결과가 같은 실패라 격리된 HP 작업이다. 관리자 HP 작업 화면에서 원인을 보고 재시도한다.
            로그는 Loki {namespace="hapbang-prod", app="{{ $labels.app_kubernetes_io_name }}"} |= "HP_TASK_DEAD]"로 찾는다([HP_TASK_DEAD]·[LECTURE_HP_TASK_DEAD] 로그).
            강의 값은 최근 10분에 DEAD가 된 수라, 10분 뒤 복구 통보가 와도 DEAD 작업은 남아 있다.

      # 대사 배치(지갑 04:02, 출연 04:00, 강의 04:30, Asia/Seoul)가 26시간 넘게 끝까지 돌지 않은 pod.
      # 지갑은 마지막 성공 시각(gauge), 강의·출연은 COMPLETED 실행 횟수(counter)로 본다. 둘 다 pod가 다시 뜨면 0부터 시작하므로
      # 26시간 넘게 산 pod만 본다. 강의·출연 counter는 첫 실행 때 series가 생기므로, 26시간 안에 늘었거나 26시간 안에 생긴 series를 실행으로 친다.
      # dev 병합마다 pod가 다시 떠서 하루를 넘기는 pod가 드물다. 그동안은 이 alert가 비어 있다.
      - uid: hapbang-reconciliation-stale
        title: 대사가 돌지 않음
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                max by (app_kubernetes_io_name, pod) (
                  (time() - hapbang_billing_reconciliation_last_success_seconds > 93600)
                    and on (pod) (time() - process_start_time_seconds > 93600)
                  or
                  (time() - process_start_time_seconds{app_kubernetes_io_name=~"lecture-app|appearance-app"} > 93600)
                    unless on (pod) (
                      increase({__name__=~"(lecture|appearance)_hp_reconciliation_runs_total", status="COMPLETED"}[26h]) > 0
                      or
                      (
                        {__name__=~"(lecture|appearance)_hp_reconciliation_runs_total", status="COMPLETED"}
                          unless on (pod) {__name__=~"(lecture|appearance)_hp_reconciliation_runs_total", status="COMPLETED"} offset 26h
                      )
                    )
                )
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ $labels.app_kubernetes_io_name }} 대사가 26시간 넘게 끝까지 돌지 않았다(pod {{ $labels.pod }}).'
          description: >-
            지갑은 재시도 뒤 failed 0으로 끝난 실행, 강의·출연은 중단 없이 끝까지 비교한 실행을 성공으로 본다.
            배치가 실행됐는지와 중단 사유를 Loki {namespace="hapbang-prod", app="{{ $labels.app_kubernetes_io_name }}"} |= "대사"로 찾는다.
            대사가 돌지 않으면 불일치 alert도 오래된 값으로 남는다.

  - orgId: 1
    name: 수집
    folder: 합방 alert
    interval: 1m
    rules:
      # Prometheus가 pod annotation으로 수집하는 앱·Envoy·cert-manager pod의 scrape 실패. 배포 중 기동 시간을 넘기도록 5분을 기다린다.
      - uid: hapbang-scrape-down
        title: 지표 수집 끊김
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                min by (app_kubernetes_io_name, pod) (up{job="kubernetes-pods"})
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [1]}
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ $labels.pod }}의 지표를 5분 넘게 수집하지 못했다.'
          description: >-
            pod는 있지만 관리 포트(/actuator/prometheus)가 응답하지 않는다. 기동 실패·재시작 반복·NetworkPolicy를 본다.
            kubectl --context hapbang-k3s get pod -A | grep {{ $labels.app_kubernetes_io_name }}, 로그는 Loki {app="{{ $labels.app_kubernetes_io_name }}"}.
            pod가 사라진 경우(Deployment 0개)는 이 alert로 알 수 없다.
