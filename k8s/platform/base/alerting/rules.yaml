# Grafana alert rule(#781). 정책과 alert마다의 조건·대응은 docs/architecture/infrastructure/observability.md "Alert 정책"(#629)이다.
# 이 파일이 원본이다. provisioning된 rule은 Grafana UI에서 고칠 수 없다. 고친 뒤 Grafana를 다시 띄워야 읽는다(같은 문서 "적용").
# - 각 rule은 A(Prometheus instant query)의 series마다 C(threshold)로 판정한다. 조건에 맞지 않는 series는 Normal이다.
# - 지표가 없으면(NoData) OK로 둔다. pod가 내려가 지표가 사라진 것은 잡지 못한다(kube-state-metrics 없음, 같은 문서 "Dashboard").
# - 쿼리가 실패하면(Prometheus 장애) Error로 두어 DatasourceError alert로 받는다. DatasourceError는 rule의 label(severity)을 이어받는다.
# - annotation은 환경 변수로 바꾸지 않으므로 Grafana template의 $labels·$values를 그대로 쓴다.
#   NoData일 때는 $values.A가 없어 template 오류가 나므로 값은 {{ with $values.A }}…{{ end }}로 감싼다.
# - label severity(#787): critical은 돈·데이터가 이미 어긋났거나 서비스가 멈춘 것, warning은 스스로 회복되거나 대응까지 여유가 있는 것이다.
#   critical은 @here 멘션과 1시간 반복, warning은 멘션 없이 4시간 반복으로 보낸다(policies.yaml).
apiVersion: 1
groups:
  - orgId: 1
    name: 돈·HP 정합성
    folder: 합방 alert
    interval: 1m
    rules:
      # 마지막으로 끝까지 비교한 실행의 규칙별 건수(gauge). 다음 실행이 끝날 때까지 값이 남는다.
      # 다만 값이 pod 메모리에만 있어 pod가 다시 뜨면 다음 대사 전까지 0이 되고 복구 통보가 간다. 강의는 #805부터 기동할 때 DB로 채운다(출연은 아직).
      - uid: hapbang-hp-reconciliation-mismatch
        title: 서비스 간 HP 대사 불일치
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                max by (app_kubernetes_io_name, rule) (
                  {__name__=~"(lecture|appearance)_hp_reconciliation_mismatches"}
                )
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.app_kubernetes_io_name }} HP 대사 규칙 {{ $labels.rule }}에서 {{ with $values.A }}{{ humanize .Value }}{{ end }}건이 어긋났다.'
          description: >-
            마지막으로 끝까지 비교한 대사 결과다. HP_TASK_DEAD는 어긋남이 아니라 DEAD 작업 때문에 비교하지 않은 건수다(관리자 HP 작업 화면에서 재시도).
            어긋난 건은 Loki {namespace="hapbang-prod", app="{{ $labels.app_kubernetes_io_name }}"} |= "rule={{ $labels.rule }}"로 찾는다.
            값은 다음 대사(매일 새벽)까지 남는다. 고친 뒤 관리자 수동 대사(POST /api/v1/lectures/admin/hp-reconciliations,
            POST /api/v1/appearances/admin/hp-reconciliations)를 실행하면 다시 비교해 값이 바뀐다. 다만 대사는 최근 바뀐 건(강의는 HP 작업이 7일 안에 바뀐 항목)과
            지갑 커서 뒤에 바뀐 보류만 보고, 바뀐 지 2시간이 안 된 건(진행 중 유예)은 빼므로, 방금 고친 건이나 범위 밖으로 밀려난 건은 비교하지 않고 0이 된다.
            그래서 0이 되거나 복구 통보가 와도 고쳤다는 뜻은 아니다.
            처음 잡힌 건(Loki의 orderItemId·rule)이 정말 고쳐졌는지 따로 확인한다. 출연은 pod가 다시 뜰 때도 값이 0이 될 수 있다(강의는 #805부터 기동할 때 DB로 채운다).

      # 마지막 잔액 대사의 결과별 지갑 수(gauge). failed는 재시도 뒤에도 대사하지 못한 지갑이다.
      # 값이 pod 메모리에만 있어 billing-app pod가 다시 뜨면 다음 대사 전까지 0이 되고 복구 통보가 간다(실행 결과가 DB에 없다).
      - uid: hapbang-wallet-reconciliation-mismatch
        title: 지갑 잔액 대사 불일치·실패
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                max by (app_kubernetes_io_name, result) (
                  hapbang_billing_reconciliation_wallets{result=~"mismatched|failed"}
                )
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: '지갑 잔액 대사에서 {{ $labels.result }} 지갑이 {{ with $values.A }}{{ humanize .Value }}{{ end }}개다.'
          description: >-
            mismatched는 잔액과 원장이 어긋난 지갑, failed는 재시도 뒤에도 대사하지 못한 지갑이다.
            Loki {namespace="hapbang-prod", app="billing-app"} |= "잔액 대사"로 walletId와 bucket별 차이를 찾는다(docs/billing/module.md).
            불일치는 자동으로 고치지 않는다. billing-app pod가 다시 뜨면 값이 0이 되어 고치지 않았는데도 복구 통보가 올 수 있다.

      # 출연: 재시도 배치 시점의 DEAD 작업 수(gauge, 처리될 때까지 남는다).
      # 강의: DEAD가 된 횟수(counter)라 최근 10분에 늘었을 때만 보낸다. 남은 DEAD는 위 대사 alert의 HP_TASK_DEAD가 매일 알린다.
      # pod가 뜬 뒤 첫 수집 전에 DEAD가 나면 첫 값이 이미 1이라 increase()가 놓친다. 10분 안에 생긴 series가 0보다 크면 함께 친다.
      - uid: hapbang-hp-task-dead
        title: HP 작업 DEAD
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                max by (app_kubernetes_io_name) (appearance_hp_task_dead)
                or
                sum by (app_kubernetes_io_name) (
                  (increase(lecture_hp_task_dead_total[10m]) > 0)
                  or
                  ((lecture_hp_task_dead_total > 0) unless lecture_hp_task_dead_total offset 10m)
                )
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.app_kubernetes_io_name }} HP 작업이 DEAD가 됐다({{ with $values.A }}{{ humanize .Value }}{{ end }}).'
          description: >-
            재시도 한도를 넘었거나 다시 보내도 결과가 같은 실패라 격리된 HP 작업이다. 관리자 HP 작업 화면에서 원인을 보고 재시도한다.
            로그는 Loki {namespace="hapbang-prod", app="{{ $labels.app_kubernetes_io_name }}"} |= "HP_TASK_DEAD]"로 찾는다([HP_TASK_DEAD]·[LECTURE_HP_TASK_DEAD] 로그).
            강의 값은 최근 10분에 DEAD가 된 수라, 10분 뒤 복구 통보가 와도 DEAD 작업은 남아 있다.

      # 대사 배치(지갑 04:02, 출연 04:00, 강의 04:30, Asia/Seoul)가 26시간 넘게 끝까지 돌지 않음.
      # - 강의: 마지막 완료 시각 gauge(#805). 앱이 뜰 때 DB의 마지막 COMPLETED 실행으로 채우므로 pod 나이와 관계없이 본다.
      #   완료한 실행이 한 번도 없거나, 기동할 때 DB를 읽지 못해 채우지 못하면 0이라 울린다(후자는 다음 대사가 끝날 때까지).
      #   기동 직후 채우기 전에 0이 한 번 수집될 수 있어 rule에 10분 지속을 둔다(#814).
      # - 지갑: 마지막 성공 시각(gauge), 출연: COMPLETED 실행 횟수(counter). 둘 다 pod가 다시 뜨면 0부터 시작하므로 26시간 넘게 산 pod만 본다.
      #   출연 counter는 첫 실행 때 series가 생기므로, 26시간 안에 늘었거나 26시간 안에 생긴 series를 실행으로 친다.
      #   dev 병합마다 pod가 다시 떠서 하루를 넘기는 pod가 드물어 이 둘은 거의 비어 있다.
      - uid: hapbang-reconciliation-stale
        title: 대사가 돌지 않음
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                max by (app_kubernetes_io_name, pod) (
                  (time() - hapbang_billing_reconciliation_last_success_seconds > 93600)
                    and on (pod) (time() - process_start_time_seconds > 93600)
                  or
                  (time() - lecture_hp_reconciliation_last_completed_seconds > 93600)
                  or
                  (time() - process_start_time_seconds{app_kubernetes_io_name="appearance-app"} > 93600)
                    unless on (pod) (
                      increase(appearance_hp_reconciliation_runs_total{status="COMPLETED"}[26h]) > 0
                      or
                      (
                        appearance_hp_reconciliation_runs_total{status="COMPLETED"}
                          unless on (pod) appearance_hp_reconciliation_runs_total{status="COMPLETED"} offset 26h
                      )
                    )
                )
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.app_kubernetes_io_name }} 대사가 26시간 넘게 끝까지 돌지 않았다(pod {{ $labels.pod }}).'
          description: >-
            지갑은 재시도 뒤 failed 0으로 끝난 실행, 강의·출연은 중단 없이 끝까지 비교한 실행을 성공으로 본다.
            강의는 DB의 마지막 완료 시각 기준이라 관리자 API GET /api/v1/lectures/admin/hp-reconciliations/latest와 같은 실행을 가리킨다.
            latest가 최근에 완료됐는데도 울리면, 기동할 때 DB를 읽지 못해 지표가 0으로 남은 것이다(lecture-app 로그 "DB에서 채우지 못해"). lecture-app을 다시 띄우거나 수동 대사를 돌리면 채워진다.
            배치가 실행됐는지와 중단 사유를 Loki {namespace="hapbang-prod", app="{{ $labels.app_kubernetes_io_name }}"} |= "대사"로 찾는다.
            대사가 돌지 않으면 불일치 alert도 오래된 값으로 남는다.

      # 강의·출연 대사가 끝까지 비교하지 못하고 INCOMPLETE로 끝난 실행(#804). 지갑 조회 실패(회로 열림·결과 불명·거절)나 예외가 원인이고,
      # 그 실행은 불일치 지표를 바꾸지 않는다. 실행 counter는 첫 실행 때 series가 생기므로 1시간 안에 늘었거나 새로 생긴 series를 친다.
      # 대사 도중 pod가 내려가 RUNNING으로 남은 실행은 다음 실행이 조용히 정리해 counter가 오르지 않는다. 강의는 #805부터 기동할 때 정리하며
      # counter를 올리고, 출연은 아직 잡지 못한다.
      - uid: hapbang-reconciliation-incomplete
        title: 대사 중단
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                max by (app_kubernetes_io_name) (
                  (increase({__name__=~"(lecture|appearance)_hp_reconciliation_runs_total", status="INCOMPLETE"}[1h]) > 0)
                  or
                  (
                    {__name__=~"(lecture|appearance)_hp_reconciliation_runs_total", status="INCOMPLETE"}
                      unless {__name__=~"(lecture|appearance)_hp_reconciliation_runs_total", status="INCOMPLETE"} offset 1h
                  )
                )
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.app_kubernetes_io_name }} HP 대사가 끝까지 비교하지 못하고 중단됐다(최근 1시간).'
          description: >-
            중단된 실행은 일부만 비교해 불일치 지표를 바꾸지 않고, 다음 실행이 같은 범위를 다시 본다. 사유는 관리자 API GET .../admin/hp-reconciliations/latest의
            실행 결과나 Loki {namespace="hapbang-prod", app="{{ $labels.app_kubernetes_io_name }}"} |= "대사"로 찾는다(지갑 조회 실패면 circuit breaker·billing-app 상태).
            원인을 고친 뒤 관리자 수동 대사(POST /api/v1/lectures/admin/hp-reconciliations, POST /api/v1/appearances/admin/hp-reconciliations)로 다시 돌릴 수 있다.
            복구 통보는 마지막 중단 뒤 1시간이 지났거나 pod가 다시 떴다는 뜻일 뿐, 다시 돌아 끝까지 비교했다는 뜻이 아니다. GET .../latest로 실행 결과를 확인한다.

  - orgId: 1
    name: 앱·인프라
    folder: 합방 alert
    interval: 1m
    rules:
      # Prometheus가 pod annotation으로 수집하는 앱·Envoy·cert-manager pod의 scrape 실패. 배포 중 기동 시간을 넘기도록 5분을 기다린다.
      - uid: hapbang-scrape-down
        title: 지표 수집 끊김
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                min by (app_kubernetes_io_name, pod) (up{job="kubernetes-pods"})
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [1]}
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.pod }}의 지표를 5분 넘게 수집하지 못했다.'
          description: >-
            pod는 있지만 관리 포트(/actuator/prometheus)가 응답하지 않는다. 기동 실패·재시작 반복·NetworkPolicy를 본다.
            kubectl --context hapbang-k3s get pod -A | grep {{ $labels.app_kubernetes_io_name }}, 로그는 Loki {app="{{ $labels.app_kubernetes_io_name }}"}.
            pod가 사라진 경우(Deployment 0개)는 이 alert로 알 수 없다.

      # cAdvisor 컨테이너 ID 수로 센 재시작(Kubernetes dashboard "컨테이너 재생성"과 같은 방식). platform 컨테이너도 본다.
      # 종료 사유(OOMKilled)는 kube-state-metrics가 없어 모르고, container_oom_events_total은 이 cluster에서 OOM을 기록하지 못한다.
      # Deployment 배포는 pod 이름이 바뀌어 세지 않는다. 이름이 같은 StatefulSet pod를 다시 만들면 한 번 센다.
      - uid: hapbang-container-restart
        title: 컨테이너 재시작
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                count by (namespace, pod, container) (
                  count by (namespace, pod, container, name) (
                    last_over_time(container_start_time_seconds{container!="", container!="POD"}[15m])
                  )
                ) - 1
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.namespace }}/{{ $labels.pod }}의 {{ $labels.container }} 컨테이너가 최근 15분에 {{ with $values.A }}{{ humanize .Value }}{{ end }}번 다시 시작했다.'
          description: >-
            원인은 지표로 알 수 없다. kubectl --context hapbang-k3s -n {{ $labels.namespace }} describe pod {{ $labels.pod }}의 Last State를 본다.
            OOMKilled면 limit이 부족하다(Kubernetes 자원 dashboard "메모리 사용률 / limit"). StatefulSet pod를 다시 만든 경우에도 한 번 울린다.
            15분 동안 재시작이 없으면 복구 통보가 온다.

      # node 루트 디스크(/dev/root). PVC(local-path)도 여기에 있다. kubelet은 85%에서 안 쓰는 이미지를 지우므로(기본값),
      # 15분 넘게 85%를 넘으면 이미지 정리로 내려가지 않는 것이다.
      - uid: hapbang-node-disk
        title: node 디스크 사용률
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                sum by (instance) (container_fs_usage_bytes{id="/", device="/dev/root"})
                  / sum by (instance) (container_fs_limit_bytes{id="/", device="/dev/root"})
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.85]}
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'node {{ $labels.instance }}의 디스크가 {{ with $values.A }}{{ humanizePercentage .Value }}{{ end }} 찼다.'
          description: >-
            large(core-data)에는 PostgreSQL·Kafka·Elasticsearch data, medium(app-observe)에는 Prometheus·Loki·Tempo data가 있다(kubectl get node -L hapbang.io/pool).
            Kubernetes 자원 dashboard "node 디스크"로 늘어난 시점을 보고, 보존 기간(Prometheus·Loki·Tempo·Kafka retention)과 안 쓰는 이미지를 줄인다.
            가득 차면 kubelet이 pod를 내보낸다.

      # cert-manager가 내는 인증서 만료 시각. Let's Encrypt 90일 인증서를 만료 30일 전에 갱신하므로, 21일 미만이면 갱신이 실패하고 있다.
      - uid: hapbang-certificate-expiry
        title: HTTPS 인증서 만료 임박
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                min by (namespace, name) (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [21]}
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '인증서 {{ $labels.namespace }}/{{ $labels.name }}가 {{ with $values.A }}{{ humanize .Value }}{{ end }}일 뒤 만료된다.'
          description: >-
            cert-manager가 만료 30일 전부터 갱신하는데 아직 새 인증서를 받지 못했다. 만료되면 모든 HTTPS 요청이 인증서 오류다.
            kubectl --context hapbang-k3s -n {{ $labels.namespace }} describe certificate {{ $labels.name }}로 Order·Challenge(HTTP-01) 상태를 보고 cert-manager 로그를 본다(docs/deploy/gateway.md).

      # Resilience4j circuit breaker가 닫히지 않은 상태(open·half_open)가 이어짐. open과 half_open을 오가도 울리도록 둘을 함께 본다.
      # 지금 있는 것: lecture·appearance → billing(HP 보류·지급), billing → toss(결제), member·billing의 앱 사이 호출.
      - uid: hapbang-circuit-breaker-open
        title: circuit breaker 열림
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                max by (app_kubernetes_io_name, name) (
                  resilience4j_circuitbreaker_state{state=~"open|half_open|forced_open"}
                )
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.app_kubernetes_io_name }}의 circuit breaker {{ $labels.name }}가 2분 넘게 닫히지 않았다.'
          description: >-
            호출 대상({{ $labels.name }})이 실패하거나 느려 호출을 막고 있다. billing이면 HP 보류·지급이, toss면 충전 결제가 멈춘다(HP 작업은 닫힌 뒤 재시도한다).
            JVM·Spring Boot dashboard의 circuit breaker 상태·호출 결과와 대상 앱의 pod·로그를 본다.

      # Kafka 소비가 재시도 뒤에도 실패해 DLT로 보낸 레코드. 토픽별 producer 지표는 첫 전송 때 생기므로(1~2분 늦게),
      # 10분 안에 늘었거나 10분 안에 새로 생긴 series를 적재로 친다. 10분 뒤 복구 통보가 와도 DLT 레코드는 남아 있다.
      - uid: hapbang-kafka-dlt
        title: Kafka DLT 적재
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                max by (app_kubernetes_io_name, topic) (
                  (increase(kafka_producer_topic_record_send_total{topic=~".+\\.DLT"}[10m]) > 0)
                  or
                  (
                    kafka_producer_topic_record_send_total{topic=~".+\\.DLT"}
                      unless kafka_producer_topic_record_send_total{topic=~".+\\.DLT"} offset 10m
                  )
                )
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.app_kubernetes_io_name }}가 {{ $labels.topic }}에 레코드를 보냈다(최근 10분 약 {{ with $values.A }}{{ humanize .Value }}{{ end }}건).'
          description: >-
            이벤트 처리가 재시도 뒤에도 실패해 이 소비자에는 반영되지 않았다. Kafka UI에서 DLT 레코드의 예외 header를 보고, 원인을 고친 뒤 재처리한다
            (docs/architecture/infrastructure/kafka.md "DLT 재처리 runbook"). Kafka dashboard "소비 그룹별 DLT 적재".

      # 연결 풀에서 connectionTimeout 안에 연결을 얻지 못해 실패한 요청·작업. 2026-11-06 14:41 KST PostgreSQL 재시작(#731 limit 변경) 때
      # lecture 약 230건, chat 3건, appearance 2건이 났다. 부하 시험·계획한 DB 재시작 때는 Grafana에서 silence를 건다.
      - uid: hapbang-db-connection-timeout
        title: DB 연결 timeout
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                sum by (app_kubernetes_io_name) (increase(hikaricp_connections_timeout_total[5m]))
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.app_kubernetes_io_name }}가 최근 5분 동안 DB 연결을 {{ with $values.A }}{{ humanize .Value }}{{ end }}번 얻지 못했다.'
          description: >-
            연결을 기다리다 timeout이 나 요청·작업이 실패했다. PostgreSQL pod 상태(재시작·장애), JVM·Spring Boot dashboard의 HikariCP(활성·대기 연결)와
            느린 쿼리, 요청 급증을 본다. 부하 시험이나 계획한 DB 재시작 중이면 silence를 건다.

      # 채팅 전달 파이프라인의 멈춤 상태(target: redis, redis-write, subscription-DELIVERY, subscription-CONTROL, 1이면 멈춤).
      - uid: hapbang-chat-delivery-paused
        title: 채팅 전달 멈춤
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                max by (app_kubernetes_io_name, pod, target) (chat_delivery_paused_state)
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.pod }}의 채팅 전달이 5분 넘게 멈췄다(target {{ $labels.target }}).'
          description: >-
            Redis 연결·쓰기 또는 Pub/Sub 구독이 실패해 메시지 실시간 전달을 멈췄다. 앱이 재확인해 스스로 다시 연다.
            Redis pod 상태(메모리 상한·재시작)와 Loki {namespace="hapbang-prod", app="chat-app"}의 WARN·ERROR 로그를 본다.

      # @Scheduled 메서드가 예외로 끝난 실행(Spring 관측 지표 tasks.scheduled.execution의 exception tag).
      # 메서드 안에서 잡아 로그만 남기는 실패는 잡히지 않는다. 예외 series는 첫 실패 때 생기므로 10분 안에 새로 생긴 series도 친다.
      - uid: hapbang-scheduled-task-failure
        title: 예약 작업 실패
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |-
                max by (app_kubernetes_io_name, code_function, exception) (
                  (increase(tasks_scheduled_execution_seconds_count{exception!="none"}[10m]) > 0)
                  or
                  (
                    tasks_scheduled_execution_seconds_count{exception!="none"}
                      unless tasks_scheduled_execution_seconds_count{exception!="none"} offset 10m
                  )
                )
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.app_kubernetes_io_name }}의 예약 작업 {{ $labels.code_function }}가 {{ $labels.exception }}로 실패했다.'
          description: >-
            @Scheduled 실행이 예외로 끝났다. 다음 주기에 다시 실행되지만 같은 원인이면 계속 실패한다.
            Loki {namespace="hapbang-prod", app="{{ $labels.app_kubernetes_io_name }}"} |= "{{ $labels.exception }}"로 stack trace를 본다.
            DB 예외(DataAccessResourceFailureException 등)면 PostgreSQL 상태를 본다.
