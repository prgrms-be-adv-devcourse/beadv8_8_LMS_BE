# Slack contact point(#781). Incoming Webhook URL은 Secret grafana-alerting의 SLACK_WEBHOOK_URL을 환경 변수로 읽는다.
# prod는 SealedSecret(k8s/platform/overlays/prod/grafana-alerting.yaml), local은 보내지지 않는 가짜 주소다.
# alerting provisioning은 contact point 설정의 $변수를 환경 변수로 바꾼다. 메시지 template을 넣을 때는 $를 $$로 쓴다.
# 메시지는 Grafana 기본 Slack template(alert 이름, 값, label, summary·description annotation, Grafana 링크)을 쓴다.
# 두 contact point는 같은 webhook(같은 채널)으로 보낸다. 멘션은 contact point 설정이라 등급마다 나눴다(#787).
# Incoming Webhook은 채널이 고정이므로 채널을 나누려면 webhook을 하나 더 만든다.
apiVersion: 1
contactPoints:
  # warning: 멘션 없음
  - orgId: 1
    name: slack
    receivers:
      - uid: hapbang-slack
        type: slack
        settings:
          url: $SLACK_WEBHOOK_URL
        disableResolveMessage: false
  # critical: 메시지 앞에 @here를 붙여 채널에 접속한 사람에게 알린다
  - orgId: 1
    name: slack-critical
    receivers:
      - uid: hapbang-slack-critical
        type: slack
        settings:
          url: $SLACK_WEBHOOK_URL
          mentionChannel: here
        disableResolveMessage: false
