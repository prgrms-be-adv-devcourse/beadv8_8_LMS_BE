# 검색·고객센터 RAG용 Elasticsearch(docs/architecture/infrastructure/search.md). ECK operator가 관리한다.
# node 1개라 고가용성이 아니다. index는 replica shard 0으로 만든다.
# 한국어 형태소 분석기 nori는 공식 이미지에 init container로 설치한다. 별도 이미지를 발행·관리하지 않는다.
# 방법: https://www.elastic.co/docs/deploy-manage/deploy/cloud-on-k8s/init-containers-for-plugin-downloads
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: hapbang
spec:
  version: 9.5.5
  # Elasticsearch CR을 지워도 PVC(검색 index)는 남긴다. index는 원본에서 재색인할 수 있지만 실수로 지우지 않게 한다.
  volumeClaimDeletePolicy: DeleteOnScaledownOnly
  nodeSets:
    - name: default
      count: 1
      podTemplate:
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: hapbang.io/pool
                        operator: In
                        values: [core-data]
          initContainers:
            # pod가 다시 뜰 때 plugin 디렉터리가 남아 있을 수 있어 이미 있으면 건너뛴다.
            - name: install-plugins
              command:
                - sh
                - -c
                - bin/elasticsearch-plugin list | grep -qx analysis-nori || bin/elasticsearch-plugin install --batch analysis-nori
          containers:
            - name: elasticsearch
              # ECK 기본 2Gi를 예산 1.5Gi로 낮춘다. heap은 limit의 50% 이하로 둔다(ES JVM settings 문서).
              env:
                - name: ES_JAVA_OPTS
                  value: -Xms768m -Xmx768m
              resources:
                requests:
                  cpu: 200m
                  memory: 1536Mi
                limits:
                  memory: 1536Mi
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: local-path-retain
            resources:
              requests:
                storage: 10Gi
