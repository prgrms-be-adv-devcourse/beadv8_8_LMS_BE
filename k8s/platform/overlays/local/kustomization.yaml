# 로컬 k3d(2노드) 검증용.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # nori 이미지는 로컬에서 빌드해 k3d image import로 넣는다(k8s/platform/base/elasticsearch/Dockerfile).
  # Docker Desktop VM의 vm.max_map_count(262144)가 ES 9 권장값(1048576)보다 작아 로컬에서만 mmap을 끈다.
  # prod는 host sysctl을 올리고 mmap을 쓴다(docs/deploy/aws-k3s.md).
  - target:
      kind: Elasticsearch
      name: hapbang
    patch: |-
      - op: add
        path: /spec/image
        value: hapbang/elasticsearch-nori:9.5.5
      - op: add
        path: /spec/nodeSets/0/config
        value:
          node.store.allow_mmap: false
# 로컬 전용 가짜 값이다. prod 값은 SealedSecret으로만 만든다(#374).
# 앱별 비밀번호는 각 앱 local overlay(apps/<앱>/k8s/overlays/local)의 DB_PASSWORD와 같아야 한다.
# prod와 같은 Secret 이름을 쓰도록 hash를 붙이지 않는다.
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: postgres-credentials
    namespace: hapbang-platform
    literals:
      - postgres=local-postgres-password
      - member=local-member-password
      - billing=local-billing-password
      - appearance=local-appearance-password
      - lecture=local-lecture-password
      - chat=local-chat-password
      - customersupport=local-customersupport-password
