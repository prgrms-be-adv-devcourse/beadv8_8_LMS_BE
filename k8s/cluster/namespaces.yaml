# 모듈 앱은 hapbang-prod, 앱들이 함께 쓰는 인프라(PostgreSQL·Kafka·Redis·Elasticsearch·관측성)는 hapbang-platform에 둔다.
# EC2에는 prod만 두므로 dev namespace는 없다(docs/architecture/infrastructure/k3s.md).
apiVersion: v1
kind: Namespace
metadata:
  name: hapbang-prod
  # 배포되는 manifest가 privileged·hostNetwork·hostPath pod로 node(IMDS 자격 증명 포함)에 닿지 못하게 막는다(#374).
  # 배포 role 자체는 SSM으로 large에서 root 명령을 실행할 수 있어 이 label로 막지 못한다(docs/deploy/security.md).
  # 앱 Deployment는 baseline을 지킨다(k3d server dry-run으로 확인). restricted는 앱의 securityContext가 없어 걸린다.
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: hapbang-platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: elastic-system
