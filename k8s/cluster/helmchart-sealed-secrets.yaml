# prod Secret을 암호화해 레포에 커밋하는 Sealed Secrets controller(#373).
# 2026년에 저장소가 bitnami-labs에서 bitnami로 옮겨졌다. Bitnami 카탈로그 변경(bitnamilegacy) 대상이 아니다
# (https://github.com/bitnami/containers/issues/83267).
# kubeseal 기본값(kube-system/sealed-secrets-controller)과 이름을 맞춘다.
# controller 개인 키를 잃으면 커밋된 SealedSecret을 모두 다시 만들어야 한다. 백업은 docs/deploy/aws-k3s.md.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: sealed-secrets
  namespace: kube-system
spec:
  repo: https://bitnami.github.io/sealed-secrets
  chart: sealed-secrets
  version: 2.22.0
  targetNamespace: kube-system
  valuesContent: |-
    fullnameOverride: sealed-secrets-controller
    # 차트 기본값은 resources가 비어 있다. 시작값이므로 실측 후 조정한다.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 64Mi
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: hapbang.io/pool
                  operator: In
                  values: [app-observe]
