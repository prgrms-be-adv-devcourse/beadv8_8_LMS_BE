# Elasticsearch를 관리하는 ECK operator(Elastic 공식 차트). CRD도 이 차트가 설치한다.
# medium(app-observe)에 두고, 기본 limit 1Gi를 128Mi로 낮춘다. 운영 3일 최대 working set 48Mi(#532, docs/architecture/infrastructure/k3s.md).
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: eck-operator
  namespace: kube-system
spec:
  repo: https://helm.elastic.co
  chart: eck-operator
  version: 3.5.0
  targetNamespace: elastic-system
  valuesContent: |-
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 128Mi
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: hapbang.io/pool
                  operator: In
                  values: [app-observe]
