# Elasticsearch를 관리하는 ECK operator(Elastic 공식 차트). CRD도 이 차트가 설치한다.
# 기본 limit 1Gi를 128Mi로 낮춘다. 운영 3일 최대 working set 48Mi(#532, docs/architecture/infrastructure/k3s.md).
# 관리 대상인 Elasticsearch와 같은 large(core-data)에 둔다. medium 메모리 예산 때문에 옮겼다(#774). 운영 7일 최대 working set 81Mi.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: eck-operator
  namespace: kube-system
spec:
  repo: https://helm.elastic.co
  chart: eck-operator
  version: 3.5.0
  targetNamespace: elastic-system
  valuesContent: |-
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 128Mi
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: hapbang.io/pool
                  operator: In
                  values: [core-data]
