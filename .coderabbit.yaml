# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit 리뷰 설정 (초안)
language: ko-KR

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    # 기본 브랜치(main) 외에 dev 대상 PR도 자동 리뷰한다
    base_branches:
      - dev
  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!gradle/wrapper/**"
  path_instructions:
    - path: "boundedContext/**/*.java"
      instructions: |
        AGENTS.md 3장 모듈 경계를 확인한다.
        - 다른 모듈의 엔티티·Repository를 직접 쓰거나 JPA 연관관계(@ManyToOne 등)로 걸지 않는다. 회원 ID(Long)로만 참조한다.
        - 모듈 간 테이블 JOIN·스키마 간 FK를 쓰지 않는다. 모듈 간 통신은 Spring Event를 기본으로 한다.
        - 모듈에서 @RestControllerAdvice를 만들지 않는다. 오류는 {Module}ErrorCode + {Module}Exception(BusinessException 상속)으로 던진다.
        - 성공 응답은 RsData로 감싸고, 200이 아니면 @ResponseStatus 또는 ResponseEntity로 상태를 맞춘다.
    - path: "boundedContext/billing/**"
      instructions: |
        돈과 HP를 다루는 영역이다. AGENTS.md 5장 규칙을 엄격히 확인한다.
        - 원장은 append-only다. 수정·삭제하지 않고 정정은 역분개로 한다. 돈 관련 데이터는 Hard Delete하지 않는다.
        - 충전 HP와 수익 HP는 서로 전환하지 않는다. HP 결제는 수익 HP를 먼저 쓰고 충전 HP를 쓴다.
        - 반환은 차감했던 HP 종류와 금액 그대로 되돌린다.
        - 동시성, 멱등성, 트랜잭션 경계 문제를 우선 지적한다.
    - path: "**/src/test/**"
      instructions: |
        테스트가 실제 요구사항을 검증하는지 본다. 사소한 스타일 지적은 하지 않는다.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "boundedContext/**/AGENTS.md"

chat:
  auto_reply: true
