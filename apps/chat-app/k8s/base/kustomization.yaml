# chat-app의 기본 manifest. 레포를 나눠도 앱 디렉터리만으로 빌드·배포할 수 있게 앱 안에 둔다.
# 공용 인프라(PostgreSQL·Kafka·Redis)는 루트 k8s/platform에 있고 아래 주소로만 연결한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hapbang-prod
resources:
  - deployment.yaml
  - service.yaml
  - gateway.yaml
  - networkpolicy.yaml
# 이름에 내용 hash가 붙으므로 값을 바꾸면 앱이 다시 배포되고, rollout undo가 이전 ConfigMap까지 되돌린다.
configMapGenerator:
  - name: chat-app-config
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=Asia/Seoul
      - HAPBANG_INTERNAL_API_PORT=8081
      # actuator(헬스체크·Prometheus 지표)는 관리 포트로만 연다. 8080에는 Gateway만 들인다(#590, D72)
      - MANAGEMENT_SERVER_PORT=8082
      # heap 상한을 limit 비율(MaxRAMPercentage=60, 704Mi면 약 410Mi)이 아니라 고정값으로 둔다. heap 사용은 운영 7일 최대 176Mi다.
      # 비율로 두면 limit을 올릴 때 heap 상한도 같이 올라, heap 상한 + heap 밖(약 370Mi)이 계속 limit을 넘는다(#684, #610).
      - JAVA_TOOL_OPTIONS=-Xmx256m
      # glibc malloc arena 수를 줄여 heap 밖 native 메모리를 줄인다. 기본값은 CPU 수 × 8이다(#610).
      - MALLOC_ARENA_MAX=2
      # trace를 Alloy(OTLP gRPC)로 보낸다. Alloy가 Tempo로 넘긴다(#631). service name은 spring.application.name(chat-app)이다
      - MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://alloy.hapbang-platform.svc.cluster.local:4317
      - DB_URL=jdbc:postgresql://postgres.hapbang-platform.svc.cluster.local:5432/chat
      - DB_USERNAME=chat
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka.hapbang-platform.svc.cluster.local:9092
      - SPRING_DATA_REDIS_HOST=redis.hapbang-platform.svc.cluster.local
      # 기존 회원 백필이 회원 목록을 읽는 회원 내부 API 주소 (출연·지갑과 같은 값)
      - MEMBER_API_BASE_URL=http://member-app:8081
      # 모집용 단체방이 모집글·지원 이력을 읽는 출연 내부 API 주소 (지갑과 같은 값)
      - APPEARANCE_API_BASE_URL=http://appearance-app:8081
