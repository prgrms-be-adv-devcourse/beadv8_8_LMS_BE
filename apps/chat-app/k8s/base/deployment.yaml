# 채팅 앱. medium(app-observe)에 둔다. 메모리 예산은 docs/architecture/infrastructure/k3s.md.
# 설정은 chat-app-config(ConfigMap), 비밀값은 chat-app-secrets(Secret)로 받는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-app
  labels:
    app.kubernetes.io/name: chat-app
    hapbang.io/pool: app-observe
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chat-app
  # medium은 surge pod를 받을 여유가 없다. 기존 pod를 먼저 내리고 새 pod를 띄운다(배포 중 잠깐 멈춤).
  # maxSurge를 생략하면 기본값 25%가 1로 올림되므로 0을 적는다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chat-app
        hapbang.io/internal-api-client: 'true'
      # Prometheus 차트 기본 kubernetes-pods job이 이 annotation을 보고 수집한다(#480). 관리 포트에서 읽는다(#590).
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8082'
        prometheus.io/path: /actuator/prometheus
    spec:
      # node별 메모리 예산이 배치를 전제로 하므로 required로 건다(docs/deploy/aws-k3s.md).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: hapbang.io/pool
                    operator: In
                    values: [app-observe]
      containers:
        - name: app
          image: chat-app
          ports:
            - name: http
              containerPort: 8080
            - name: internal
              containerPort: 8081
            # actuator 전용(MANAGEMENT_SERVER_PORT). probe와 Prometheus만 쓴다
            - name: management
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: chat-app-config
            - secretRef:
                name: chat-app-secrets
          # 384Mi에서 운영 기동 직후(Kafka consumer partition 할당 뒤) OOMKilled돼 512Mi로 올렸다. 기동 25분 뒤 430Mi(84%) (#545, docs/architecture/infrastructure/k3s.md)
          # 512Mi에서 운영 working set 433Mi(85%)였고, 지표 노출과 관리 포트(Tomcat 하나 더, 약 +10MB)를 더하며 576Mi로 올린다(#590).
          # trace(#631)를 붙이며 640Mi로 올렸다. 2026-11-03 운영 working set 541Mi(94%)였고, lecture-app은 trace로 k3d에서 약 +18Mi(#579)였다.
          # 640Mi에서 7일 최대 598Mi(93%)였다. heap 사용은 최대 176Mi인데 상한(limit의 60%)이 371Mi라 상한까지 차면 limit을 넘는다.
          # heap 상한을 -Xmx256m으로 고정하고(kustomization.yaml) heap 256 + heap 외 JVM 영역 238 + native 약 130 ≈ 624Mi에 여유를 더해 704Mi로 올린다(#684, #610).
          # 704Mi에서 운영 약 40시간(pod 4개) 최대 working set 592Mi(84%), heap committed 최대 210Mi, 재시작 0회였다(2026-11-06, #694).
          resources:
            requests:
              cpu: 100m
              memory: 704Mi
            limits:
              memory: 704Mi
          # JVM 기동이 느린 node 재시작(앱 여러 개 동시 기동)을 고려해 최대 5분 기다린다.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
          # 이미지의 USER가 이름(app)이라 kubelet이 non-root인지 확인할 수 있게 uid(Dockerfile의 10001)를 적는다.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
