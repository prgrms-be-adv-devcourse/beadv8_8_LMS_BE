# chat-app 테스트 전용 설정. @IntegrationTest·@ChatE2ETest가 spring.config.name=hapbang-module-test로 읽는다.
# src/test 아래라 배포 jar에는 포함되지 않는다.
spring:
  config:
    # 운영 application.yaml을 읽지 않는 모듈 테스트에도 Swagger 설정은 그대로 가져와 실제 경로·운영 값을 검사한다
    import: classpath:swagger.yml
  datasource:
    hikari:
      # 테스트는 컨텍스트를 여러 개 캐시하고 각 컨텍스트가 연결 풀을 가진다. 기본 10개면 PostgreSQL 컨테이너의
      # max_connections(100)를 넘으므로 줄인다. 동시성 테스트(8스레드)는 행 잠금으로 줄을 서므로 연결을 기다렸다가 진행한다.
      maximum-pool-size: 5
  data:
    redis:
      # 모듈 테스트는 application.yaml을 읽지 않으므로 운영과 같은 명령 시간 제한을 여기에도 둔다.
      # 주소(host·port)는 두지 않는다. Redis 컨테이너를 쓰는 테스트만 주소를 넣고, 주소가 없는 테스트는 Redis 구독을 시작하지 않는다
      # (support/ChatBrokerlessTestConfig)
      timeout: 10s
  kafka:
    # 대부분의 채팅 테스트에는 Kafka가 없다. 회원·출연 이벤트 리스너가 브로커에 계속 연결하거나 DLT 토픽 선언이 브로커를 기다리며
    # 컨텍스트 기동을 늦추지 않게 끈다. Kafka를 쓰는 테스트(KafkaTestcontainersConfig)만 다시 켠다. 리스너 자동 시작을 끈 테스트에서는
    # 회원 이벤트 DLT 확인기도 등록하지 않는다(support/ChatBrokerlessTestConfig)
    listener:
      auto-startup: false
    admin:
      auto-create: false
  modulith:
    events:
      # 단체방 이벤트의 Kafka 외부화는 끈다. Kafka 브로커가 없는 테스트에서 보내기를 시도하지 않고 토픽도 선언하지 않는다.
      # Kafka 발행은 AppearanceNotificationEventListenerTest가 Testcontainers Kafka와 함께 켜서 확인한다
      externalization:
        enabled: false
      # 운영 application.yaml과 같은 값이다(모듈 테스트는 application.yaml을 읽지 않는다)
      kafka:
        enable-json: false
hapbang:
  clients:
    # 회원·출연 내부 API 주소. 운영은 application.yaml·환경 변수가 넣는다. 모듈 테스트는 application.yaml을 읽지 않으므로 아무도 듣지
    # 않는 주소를 둔다(부르면 연결 실패). 실제로 부르는 테스트는 테스트 HTTP 서버 주소로 덮는다
    member:
      base-url: http://localhost:9
    appearance:
      base-url: http://localhost:9
