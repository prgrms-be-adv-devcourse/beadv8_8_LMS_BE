# 앱별 실행 설정. 구조 전환 제약은 docs/architecture/app-modules.md 참고.
# Flyway 이력·Modulith 발행 기록은 앱 스키마에 둔다. 기존 모놀리스 DB의 이력 전환은 별도 작업이다.
spring:
  application:
    name: chat-app
  config:
    import:
    - classpath:swagger.yml
  profiles:
    default: local
  autoconfigure:
    # 앱은 Gateway 사용자 헤더와 내부 API 키로 인증해 UserDetailsService가 없다. 빼지 않으면 Boot가 기본 사용자(user)를 만들고
    # 생성 비밀번호를 기동 로그(WARN)에 남긴다(#733). 프로필 파일에서 이 목록을 다시 쓰면 합쳐지지 않고 바뀐다
    exclude:
    - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  mvc:
    formcontent:
      filter:
        enabled: false
  modulith:
    detection-strategy: explicitly-annotated
    events:
      jdbc:
        schema-initialization:
          enabled: true
        schema: chat
      republish-outstanding-events-on-restart: true
      completion-mode: archive
      # Modulith Kafka 모듈의 JSON 기본 세트(spring.kafka.* 직렬화 기본값을 넣는 속성 파일 + 바이트 JSON 변환기 빈)를 끈다.
      # 단체방 이벤트는 코드로 만든 발행 템플릿(ChatEventKafkaConfig)의 JSON 직렬화기로 보내므로 쓰지 않는 기본값·빈을 두지 않는다.
      # Modulith 자동 설정을 켜고 끄는 값이라 코드로 옮길 수 없다. 모듈 테스트 설정(hapbang-module-test.yaml)에도 같은 값을 둔다
      kafka:
        enable-json: false
  datasource:
    hikari:
      # 미확정 초기값(Q12). 전달 파이프라인이 동시에 쓰는 연결은 최대 11개(주기 작업 8 + 새 작업 worker 3)이고 나머지 9개를 REST·STOMP가 쓴다.
      # worker·주기 작업 수를 늘리면 함께 늘린다. PostgreSQL max_connections는 다른 앱과 나눠 쓴다
      maximum-pool-size: 20
  data:
    redis:
      # 미확정 초기값(Q12). 전달 consumer의 BLOCK(2s)보다 길고 relay lease·회수 min-idle(30s)보다 짧게 둔다(Lettuce 기본 60s 대기를 줄인다)
      timeout: 10s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true
    default-schema: chat
    schemas:
    - chat
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s
  task:
    scheduling:
      pool:
        size: 4
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      # 응답 시간 p50·p95·p99를 histogram_quantile로 계산할 bucket 경계(#617).
      # percentiles-histogram(기본 bucket 69개)보다 시리즈가 적도록 경계 10개만 직접 정한다
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1000ms,2500ms,5000ms
        # 진행 중 요청 수(http.server.requests.active)도 접두어가 같아 bucket이 붙으므로 빈 값으로 끈다
        http.server.requests.active: ""
  # trace(#579, #631). Envoy를 거친 요청은 Envoy가 traceparent flag로 넘긴 샘플링 결정을 따른다(Boot 기본 sampler가 parent-based).
  # 아래 비율은 배치처럼 앱 안에서 시작하는 trace에만 쓴다
  tracing:
    sampling:
      probability: 0.1
  opentelemetry:
    tracing:
      export:
        otlp:
          # Alloy는 OTLP gRPC(4317)만 받는다. endpoint는 k8s ConfigMap이 넣고, 없으면(로컬·테스트) 보내지 않는다
          transport: grpc
  otlp:
    metrics:
      export:
        # starter-opentelemetry가 함께 넣는 OTLP 지표 export를 끈다. 지표는 Prometheus가 /actuator/prometheus로 수집한다
        enabled: false
hapbang:
  scheduling:
    enabled: true
  internal-api:
    key: "${HAPBANG_INTERNAL_API_KEY:}"
  clients:
    # 기존 회원 백필의 회원 내부 API (설계 문서 5.4). 기본값은 로컬 member-app 포트. 시간 제한은 Client 기본값(연결 2초·응답 5초)
    member:
      base-url: "${MEMBER_API_BASE_URL:http://localhost:8081}"
    # 모집용 단체방의 출연 내부 API (설계 3.4). 기본값은 로컬 appearance-app 포트. 시간 제한은 Client 기본값(연결 2초·응답 5초)
    appearance:
      base-url: "${APPEARANCE_API_BASE_URL:http://localhost:8083}"
