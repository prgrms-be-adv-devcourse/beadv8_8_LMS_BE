# 앱별 실행 설정. 구조 전환 제약은 docs/architecture/app-modules.md 참고.
# Flyway 이력·Modulith 발행 기록은 앱 스키마에 둔다. 모놀리스가 만든 기존 DB는 앱 분리 시점의 마지막 마이그레이션(baseline-version)으로 baseline하고, 그 뒤 버전만 실행한다.
spring:
  application:
    name: customer-support-app
  profiles:
    default: local
  mvc:
    formcontent:
      filter:
        enabled: false
  modulith:
    detection-strategy: explicitly-annotated
    events:
      jdbc:
        schema-initialization:
          enabled: true
        schema: customersupport
      republish-outstanding-events-on-restart: true
      completion-mode: archive
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
    baseline-version: 202610141900
    out-of-order: true
    default-schema: customersupport
    schemas:
    - customersupport
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s
  task:
    scheduling:
      pool:
        size: 4
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
hapbang:
  scheduling:
    enabled: true
  internal-api:
    key: "${HAPBANG_INTERNAL_API_KEY:}"
springdoc:
  swagger-ui:
    csrf:
      enabled: true
