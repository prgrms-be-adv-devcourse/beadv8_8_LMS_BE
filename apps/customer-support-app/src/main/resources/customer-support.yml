# 고객센터 앱 전용 설정.
# 앱 실행 설정(application.yaml)과 나눠 두고, application.yaml의 spring.config.import로 읽는다 (테스트는 hapbang-module-test.yaml).
spring:
  # Kafka 값 직렬화 방식 (#279 발행·수신). 운영과 테스트가 같은 값을 쓰도록 이 파일에 둔다.
  # Modulith Kafka 모듈의 JSON 기본 세트(값 byte[] 직렬화·역직렬화 + 바이트 JSON 변환기 빈)를 끈다.
  # 켜 두면 그 변환기가 기본 리스너 팩토리에도 들어가, 역직렬화기로 객체를 받는 강의 이벤트 리스너가 실패한다.
  # 발행은 아래 JSON 직렬화기가, 수신은 리스너에 지정한 역직렬화기가 맡는다 (강의·출연 앱과 같은 방식).
  modulith:
    events:
      kafka:
        enable-json: false
  kafka:
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    # trace(#630): 보내는 메시지 헤더에 traceparent를 싣고 producer span을 남긴다(Boot 기본 KafkaTemplate, Modulith 외부화가 쓴다)
    template:
      observation-enabled: true
    # 받은 메시지 헤더의 traceparent를 부모로 consumer span을 만든다(Boot 기본 리스너 컨테이너 팩토리)
    listener:
      observation-enabled: true
