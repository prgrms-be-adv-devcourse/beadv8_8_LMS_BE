apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: customer-support-app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: customer-support-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
      podSelector:
        matchLabels:
          hapbang.io/gateway-proxy: 'true'
    ports:
    - protocol: TCP
      port: 8080
  - from:
    - podSelector:
        matchLabels:
          hapbang.io/internal-api-client: 'true'
    ports:
    - protocol: TCP
      port: 8081
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32
