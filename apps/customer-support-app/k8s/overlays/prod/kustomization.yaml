# EC2 k3s prod. 배포 workflow(#374)가 앱마다 이 overlay를 적용한다.
# - 이미지: #374가 `kustomize edit set image`로 GHCR의 sha-<커밋> 태그를 넣는다.
# - Secret: customer-support-app-secrets(DB_PASSWORD, HAPBANG_INTERNAL_API_KEY)는 이 디렉터리의 SealedSecret(`customer-support-app-secrets.yaml`)이다. k8s/tools/seal-app-secrets.sh로 만든다(#374).
# - 이미지는 공개 GHCR 패키지라 pull secret을 두지 않는다(#374).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - customer-support-app-secrets.yaml
