# EC2 k3s prod. 배포 workflow(#374)가 앱마다 이 overlay를 적용한다.
# - 이미지: #374가 `kustomize edit set image`로 GHCR의 sha-<커밋> 태그를 넣는다.
# - Secret: customer-support-app-secrets(DB_PASSWORD, HAPBANG_INTERNAL_API_KEY)는 SealedSecret으로 이 디렉터리에 커밋한다(#374).
# - ghcr-pull(GHCR pull secret)은 앱마다 두지 않고 hapbang-prod namespace에 하나만 둔다(#374).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull
