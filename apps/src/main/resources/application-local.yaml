# 로컬 개발: Docker Compose로 PostgreSQL을 띄우고 연결 정보는 자동으로 주입된다.
spring:
  config:
    # 루트 .env에서 구글 키를 읽는다 (파일이 없어도 실행된다)
    import: optional:file:.env[.properties]
  docker:
    compose:
      # 프로젝트 루트 기준 경로(IntelliJ 기본 작업 디렉터리, bootRun도 루트로 맞춤).
      # .env도 compose 파일과 같은 디렉터리에서 읽힌다.
      file: docker/compose.yaml
  jpa:
    hibernate:
      # 로컬: 엔티티를 보고 테이블을 만들거나 컬럼을 추가한다
      ddl-auto: update
    properties:
      # 스키마도 같이 만든다
      hibernate.hbm2ddl.create_namespaces: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
