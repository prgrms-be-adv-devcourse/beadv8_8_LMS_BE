# 로컬 개발: Docker Compose로 PostgreSQL을 띄우고 연결 정보는 자동으로 주입된다.
spring:
  config:
    # 루트 .env에서 구글 키를 읽는다 (파일이 없어도 실행된다)
    import: optional:file:.env[.properties]
  docker:
    compose:
      # 프로젝트 루트 기준 경로(IntelliJ 기본 작업 디렉터리, bootRun도 루트로 맞춤).
      # .env도 compose 파일과 같은 디렉터리에서 읽힌다.
      file: docker/compose.yaml
  security:
    oauth2:
      client:
        registration:
          google:
            # 키가 없어도 로컬 실행·테스트는 되게 한다 (구글 로그인만 안 됨). 실제 키는 루트 .env
            client-id: ${GOOGLE_CLIENT_ID:local-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-placeholder}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

hapbang:
  local-login:
    # 구글 없이 역할로 로그인 (POST /api/v1/members/local-login) + 역할별 테스트 계정 생성. 서버에선 켜지 않는다
    enabled: true
