# 운영: 접속 정보는 환경 변수로 주입한다. 값이 없으면 시작 단계에서 실패한다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

hapbang:
  chat:
    websocket:
      # 채팅 웹소켓 핸드셰이크를 허용할 프론트 출처 (#235). 여러 개면 쉼표로 구분한다
      allowed-origins: https://hapbang.duckdns.org
  storage:
    s3:
      # 공개 레포라 버킷 이름은 서버 env 파일에만 둔다. 접근은 EC2 인스턴스 역할로 한다(docs/deploy/s3.md)
      bucket: ${S3_BUCKET}
      # dev·prod가 버킷 하나를 쓰므로 key 앞에 환경 이름을 붙여 나눈다
      key-prefix: prod

# edge nginx가 HTTPS를 종료하고 X-Forwarded-* 헤더로 전달한다.
# 원래 scheme·host를 인식해 리다이렉트 URL을 https로 만들고 세션 쿠키에 Secure를 붙인다.
# native: Tomcat이 내부망(Docker 네트워크) 프록시의 헤더만 신뢰한다.
server:
  forward-headers-strategy: native

# API 명세를 외부에 노출하지 않는다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
