# 모든 환경 공통 설정. 환경별 설정은 application-{profile}.yaml에 둔다.
spring:
  application:
    name: hapbang
  profiles:
    # 프로필을 지정하지 않으면 local로 실행한다. 운영은 SPRING_PROFILES_ACTIVE=prod로 지정한다.
    default: local
  modulith:
    detection-strategy: explicitly-annotated
    events:
      jdbc:
        # event_publication 테이블을 애플리케이션 시작 시 생성한다(이미 있으면 건너뜀).
        schema-initialization:
          enabled: true
      # 서버가 재시작되면 처리되지 않은 이벤트를 다시 발행한다.
      republish-outstanding-events-on-restart: true
      # 처리 완료된 이벤트는 event_publication_archive로 옮겨 기록을 남긴다.
      completion-mode: archive
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 만든다. Hibernate는 엔티티와 테이블이 맞는지 검사만 하고, 다르면 시작에 실패한다.
      ddl-auto: validate
  flyway:
    # 마이그레이션은 기본 위치 classpath:db/migration에서 찾는다. 모든 모듈의 SQL이 클래스패스에서 합쳐진다.
    # 이미 테이블(event_publication 등)이 있는 서버 DB에 처음 적용할 때 이력 테이블을 만들고, 버전 0 이후 마이그레이션을 모두 실행한다.
    baseline-on-migrate: true
    baseline-version: 0
    # 버전은 작성 시각이라, 먼저 작성했지만 늦게 병합된 마이그레이션은 이미 적용된 버전보다 낮다.
    # 모듈마다 스키마가 달라 서로 의존하지 않으므로 낮은 버전도 실행한다(끄면 앱 시작이 실패한다).
    out-of-order: true
