# appearance-app의 기본 manifest. 레포를 나눠도 앱 디렉터리만으로 빌드·배포할 수 있게 앱 안에 둔다.
# 공용 인프라(PostgreSQL·Kafka·Redis)는 루트 k8s/platform에 있고 아래 주소로만 연결한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hapbang-prod
resources:
  - deployment.yaml
  - service.yaml
  - gateway.yaml
  - networkpolicy.yaml
# 이름에 내용 hash가 붙으므로 값을 바꾸면 앱이 다시 배포되고, rollout undo가 이전 ConfigMap까지 되돌린다.
configMapGenerator:
  - name: appearance-app-config
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=Asia/Seoul
      - HAPBANG_INTERNAL_API_PORT=8081
      # actuator(헬스체크·Prometheus 지표)는 관리 포트로만 연다. 8080에는 Gateway만 들인다(#528, D72)
      - MANAGEMENT_SERVER_PORT=8082
      # heap 상한을 limit 비율(MaxRAMPercentage=60, 640Mi면 약 371Mi)이 아니라 고정값으로 둔다. heap 사용은 운영 7일 최대 110Mi,
      # Tenured 사용은 최대 66Mi다. 비율로 두면 heap 상한 + heap 밖(약 345Mi)이 limit을 넘는다(#726, #610).
      # 처음 176m(#726)에서 운영 4일(pod 4개, 최장 43.6시간) heap 사용 최대 116Mi, full GC 뒤 live 58Mi, heap committed 136~161Mi였다.
      # 144m은 Tenured 상한 약 96Mi에 live가 60%라 full GC가 이어지지 않고, heap committed가 144Mi 이하로 묶여 limit을 576Mi로 낮출 수 있다(#774).
      # JVM이 heap·metaspace 등을 할당하지 못해 OutOfMemoryError를 던지면 종료 코드 3으로 끝내 같은 pod에서 다시 시작한다.
      # 끝내지 않으면 오류만 내며 떠 있어 어떤 alert도 울리지 않는다. 다시 시작하면 Grafana "컨테이너 재시작" alert가 받는다(#854).
      # Java 코드가 직접 만들어 던지는 OutOfMemoryError(direct buffer 한도 초과 등)는 종료하지 않는다.
      - JAVA_TOOL_OPTIONS=-Xmx144m -XX:+ExitOnOutOfMemoryError
      # glibc malloc arena 수를 줄여 heap 밖 native 메모리를 줄인다. 기본값은 CPU 수 × 8이다(#610).
      - MALLOC_ARENA_MAX=2
      # trace를 Alloy(OTLP gRPC)로 보낸다. Alloy가 Tempo로 넘긴다(#631). service name은 spring.application.name(appearance-app)이다
      - MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://alloy.hapbang-platform.svc.cluster.local:4317
      - DB_URL=jdbc:postgresql://postgres.hapbang-platform.svc.cluster.local:5432/appearance
      - DB_USERNAME=appearance
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka.hapbang-platform.svc.cluster.local:9092
      - SPRING_DATA_REDIS_HOST=redis.hapbang-platform.svc.cluster.local
      # 보류·반환·지급·위약금을 보내는 지갑 내부 API 주소 (#274, 내부 포트 #372)
      - BILLING_API_BASE_URL=http://billing-app:8081
      # 기존 회원 Backfill이 회원 목록을 읽는 회원 내부 API 주소 (#394, 지갑과 같은 값)
      - MEMBER_API_BASE_URL=http://member-app:8081
