# 출연 앱. large(core-data)에 둔다. 메모리 예산은 docs/architecture/infrastructure/k3s.md.
# 설정은 appearance-app-config(ConfigMap), 비밀값은 appearance-app-secrets(Secret)로 받는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appearance-app
  labels:
    app.kubernetes.io/name: appearance-app
    hapbang.io/pool: core-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: appearance-app
  # large는 surge pod 1개를 받을 여유가 있다. 새 pod가 Ready가 된 뒤 기존 pod를 내린다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: appearance-app
        hapbang.io/internal-api-client: 'true'
      # Prometheus 차트 기본 kubernetes-pods job이 이 annotation을 보고 수집한다(#480). 관리 포트에서 읽는다(#528).
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8082'
        prometheus.io/path: /actuator/prometheus
    spec:
      # node별 메모리 예산이 배치를 전제로 하므로 required로 건다(docs/deploy/aws-k3s.md).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: hapbang.io/pool
                    operator: In
                    values: [core-data]
      containers:
        - name: app
          image: appearance-app
          ports:
            - name: http
              containerPort: 8080
            - name: internal
              containerPort: 8081
            # actuator 전용(MANAGEMENT_SERVER_PORT). probe와 Prometheus만 쓴다
            - name: management
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: appearance-app-config
            - secretRef:
                name: appearance-app-secrets
          # EC2에서 448Mi로 띄우자 기동 3분 뒤 RSS 425Mi로 한도에 붙어 512Mi로 올렸다(#504).
          # 512Mi에서 운영 working set 461Mi(90%)였고, 지표 노출과 관리 포트(Tomcat 하나 더, 약 +10MB)를 더하며 576Mi로 올린다(#528).
          # trace(#631)를 붙이며 640Mi로 올렸다. 2026-11-03 운영 working set 463Mi(80%)였고, lecture-app은 trace로 k3d에서 약 +18Mi(#579)였다.
          # 7일 최대 working set 510Mi(80%)였다. heap 상한을 -Xmx176m으로 고정하고(kustomization.yaml) limit은 둔다.
          # heap 176 + heap 외 JVM 영역 213 + native 132 ≈ 521Mi(81%)다(#726, #610).
          resources:
            requests:
              cpu: 100m
              memory: 640Mi
            limits:
              memory: 640Mi
          # JVM 기동이 느린 node 재시작(앱 여러 개 동시 기동)을 고려해 최대 5분 기다린다.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
          # 이미지의 USER가 이름(app)이라 kubelet이 non-root인지 확인할 수 있게 uid(Dockerfile의 10001)를 적는다.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
