# 앱별 실행 설정. 구조 전환 제약은 docs/architecture/app-modules.md 참고.
spring:
  config:
    import: optional:file:.env[.properties]
  docker:
    compose:
      file: docker/compose.yaml
      lifecycle-management: start-only
  modulith:
    events:
      # 로컬 compose에는 Kafka가 없으므로 알림 이벤트의 Kafka 외부화(#393)를 끈다.
      # 로컬 Kafka로 확인할 때는 SPRING_MODULITH_EVENTS_EXTERNALIZATION_ENABLED=true로 켠다
      externalization:
        enabled: false
springdoc:
  swagger-ui:
    path: "/swagger-ui.html"
hapbang:
  internal-api:
    key: "${HAPBANG_INTERNAL_API_KEY:local-placeholder}"
server:
  port: "${SERVER_PORT:8083}"
