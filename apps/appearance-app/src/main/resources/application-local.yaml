# 앱별 실행 설정. 구조 전환 제약은 docs/architecture/app-modules.md 참고.
spring:
  config:
    import: optional:file:.env[.properties]
  docker:
    compose:
      file: docker/compose.yaml
      lifecycle-management: start-only
springdoc:
  swagger-ui:
    path: "/swagger-ui.html"
hapbang:
  internal-api:
    key: "${HAPBANG_INTERNAL_API_KEY:local-placeholder}"
  clients:
    billing:
      base-url: http://localhost:8082
server:
  port: "${SERVER_PORT:8083}"
