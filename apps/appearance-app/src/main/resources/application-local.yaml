# 앱별 실행 설정. 구조 전환 제약은 docs/architecture/app-modules.md 참고.
spring:
  config:
    import: optional:file:.env[.properties]
  docker:
    compose:
      file: docker/compose.yaml
      lifecycle-management: start-only
  modulith:
    events:
      # 로컬 compose에는 Kafka가 없으므로 알림 이벤트의 Kafka 외부화(#393)를 끈다.
      # 로컬 Kafka로 확인할 때는 SPRING_MODULITH_EVENTS_EXTERNALIZATION_ENABLED=true로 켠다
      externalization:
        enabled: false
  # 로컬 compose에는 Kafka가 없다. 회원 이벤트 리스너(#394)와 토픽 생성이 연결을 계속 시도하지 않게 끈다.
  # Kafka를 띄워 확인할 때는 SPRING_KAFKA_LISTENER_AUTO_STARTUP·SPRING_KAFKA_ADMIN_AUTO_CREATE를 true로 준다.
  kafka:
    listener:
      auto-startup: false
    admin:
      auto-create: false
springdoc:
  swagger-ui:
    path: "/swagger-ui.html"
hapbang:
  internal-api:
    key: "${HAPBANG_INTERNAL_API_KEY:local-placeholder}"
  clients:
    billing:
      base-url: http://localhost:8082
server:
  port: "${SERVER_PORT:8083}"
