# 출연 모듈 전용 설정.
# 앱 실행 설정(application.yaml)과 나눠 두고, application.yaml의 spring.config.import로 읽는다 (테스트는 hapbang-module-test.yaml).
# 정책 값(appearance.policy)은 이 파일에서만 바꾼다. 환경 변수 등 외부 설정으로 덮어쓰지 않는다.
spring:
  # Kafka 값 직렬화 방식 (#393 발행, #394 수신). 운영과 테스트가 같은 값을 쓰도록 이 파일에 둔다.
  # Modulith Kafka 모듈의 JSON 기본 세트(값 byte[] 직렬화·역직렬화 + 바이트 JSON 변환기 빈)를 끈다.
  # 켜 두면 그 변환기가 기본 리스너 팩토리에도 들어가, 역직렬화기로 객체를 받는 회원 이벤트 리스너가 모두 실패한다.
  # 발행은 아래 JSON 직렬화기가, 수신은 리스너마다 지정한 역직렬화기가 맡는다 (회원 앱 발행 설계와 같은 방식).
  modulith:
    events:
      kafka:
        enable-json: false
  kafka:
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    # trace(#630): 보내는 메시지 헤더에 traceparent를 싣고 producer span을 남긴다(Boot 기본 KafkaTemplate, Modulith 외부화가 쓴다)
    template:
      observation-enabled: true
    # 받은 메시지 헤더의 traceparent를 부모로 consumer span을 만든다(Boot 기본 리스너 컨테이너 팩토리)
    listener:
      observation-enabled: true
appearance:
  policy:
    # 최저 출연료 (1인당, HP)
    minimum-fee: 20000
    # 호스트 일방 취소 위약금 비율 (1~100). 원 단위 미만은 버린다.
    penalty-rate-percent: 30
    # 출연 확인 기간: 방송 예정 일시 + 7×24시간
    confirm-period: 7d
    # 출연 1건당 출연 취소 요청 최대 횟수 (거절 후 1회 재요청)
    max-cancel-request-count: 2
    # 출연 모집글 하나의 최대 모집 인원 (최소 1명)
    max-recruit-count: 10
  review:
    # 리뷰 작성 기간: 출연 확인 시각부터 이 기간 안에만 쓸 수 있다. 비우면 무기한 (지금은 무기한, 켤 때 예: 14d)
    # 값을 넣으면 기한이 지나도록 한쪽만 쓴 리뷰를 공개하는 배치(review-expire-publish-cron)도 함께 켜진다 (#515)
    write-period:
  batch:
    # 배치는 hapbang.scheduling.enabled=true일 때만 돈다 (팀 공통 #157, 앱에서만 켜짐). 모든 cron은 KST
    # 실행 순서를 엇갈리게 둔다: 보류 재확인(00초) → 알림 Kafka 재발행(05초) → 모집 기한 마감(10초) → 리뷰 작성 기한 만료 공개(15초) → 수락 기한 만료(20초) → 출연 취소 요청 자동 거절(30초) → HP 작업 재시도(40초) → 출연 자동 확인(50초)
    hold-recheck-cron: "0 * * * * *"
    event-republish-cron: "5 * * * * *"
    recruit-close-cron: "10 * * * * *"
    # 작성 기한(appearance.review.write-period)이 비어 있으면(지금) 아무것도 하지 않는다 (#515)
    review-expire-publish-cron: "15 * * * * *"
    expire-cron: "20 * * * * *"
    cancel-auto-reject-cron: "30 * * * * *"
    hp-task-retry-cron: "40 * * * * *"
    auto-confirm-cron: "50 * * * * *"
    # 서비스 간 HP 대사 (#581): 매일 04:00:25. 매분 도는 배치들과 겹치지 않는 25초
    hp-reconciliation-cron: "25 0 4 * * *"
    # 한 번 실행할 때 처리할 최대 건수 (나머지는 다음 주기)
    batch-size: 100
    # 방금 시작된 처리(보내기·거절 직후 즉시 실행, 커밋 직후 Kafka 보내기)와 겹치지 않도록 이 시간이 지난 것만 배치가 가져간다
    pending-grace: 1m
    # 보류 결과를 모르는 요청서·모집글을 포기하는 기준 (#536): 만든 지 이 시간이 지나면 보류 재확인 배치가 보류 대신 보류 무효화를 보내 HOLD_FAILED로 끝낸다
    hold-void-after: 1h
    # HP 작업 재시도: 지수 백오프 + 지터 (1분 → 2분 → 4분 → … → 최대 1시간, 10회 실패 시 격리)
    retry-base-delay: 1m
    retry-max-delay: 1h
    retry-max-attempts: 10
    retry-jitter-ratio: 0.2
  # 서비스 간 HP 대사 (#581): 요청서·모집글·출연 상태와 지갑 보류·지급을 비교해 어긋난 건을 남긴다(고치지 않음)
  hp-reconciliation:
    # 진행 중으로 보고 빼는 시간: 대상·출연·HP 작업이 이 시간 안에 바뀌었으면 비교하지 않는다 (HP 작업 재시도 최대 간격 1시간보다 길게)
    settle-grace: 2h
    # 출연 쪽 비교 범위: 이 기간 안에 바뀐 요청서·모집글. 지갑 쪽 변경은 지갑 보류 목록 커서로 모은다
    lookback: 7d
    # 지갑 조회 한 번의 건수 (최대 500)
    page-size: 500
