# EC2 k3s prod. 배포 workflow(#374)가 앱마다 이 overlay를 적용한다.
# - 이미지: #374가 `kustomize edit set image`로 GHCR의 sha-<커밋> 태그를 넣는다.
# - Secret: billing-app-secrets(DB_PASSWORD, HAPBANG_INTERNAL_API_KEY, 선택: TOSS_PAYMENTS_SECRET_KEY 등 결제 키 3개)는 이 디렉터리의 SealedSecret(`billing-app-secrets.yaml`)이다. k8s/tools/seal-app-secrets.sh로 만든다(#374).
# - GHCR 패키지는 조직 정책으로 private이다. hapbang-prod의 공유 Secret ghcr-pull(k8s/registry)로 받는다. 앱 배포는 이 Secret을 만들거나 지우지 않는다(#461).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - billing-app-secrets.yaml
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull
