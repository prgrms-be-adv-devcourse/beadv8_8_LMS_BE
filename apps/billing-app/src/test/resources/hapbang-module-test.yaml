# 지갑 모듈 테스트 전용 설정. src/test 아래라 배포 jar에는 포함되지 않는다.
spring:
  config:
    # 운영 application.yaml을 읽지 않는 모듈 테스트에도 지갑 설정(락 대기 상한)만 명시적으로 가져온다.
    # Swagger 설정도 그대로 가져와 실제 경로·운영 값을 검사한다 (#498)
    import:
    - classpath:billing.yml
    - classpath:swagger.yml
  jpa:
    properties:
      # 플랫폼 지갑(#336)은 운영에서 Flyway가 한 행을 넣는다. 테스트 DB 정리(SchemaManager.truncate)가 그 행도 지우므로,
      # 비운 뒤 이 스크립트로 다시 넣는다(Hibernate가 비운 다음 import 스크립트를 실행한다). 처음 기동 때는 Flyway 행을 그대로 쓴다.
      jakarta.persistence.sql-load-script-source: billing-test-platform-wallet.sql
  modulith:
    events:
      # 운영과 같이 발행 기록 테이블을 Modulith가 만든다 (#497)
      jdbc:
        schema-initialization:
          enabled: true
        schema: billing
      completion-mode: archive
      # 지갑 이벤트의 Kafka 외부화는 끈다. Kafka 브로커가 없는 테스트에서 보내기를 시도하지 않게 한다.
      # Kafka 발행은 BillingEventKafkaTest가 Testcontainers Kafka와 함께 켜서 확인한다
      externalization:
        enabled: false
  kafka:
    # 대부분의 테스트에는 Kafka가 없다. 리스너가 연결을 계속 시도하거나 토픽 생성이 시간 초과를 기다리지 않게 끈다.
    # Kafka 소비 테스트(BillingMemberEventKafkaTest)만 KafkaTestcontainersConfig와 함께 다시 켠다 (#430).
    listener:
      auto-startup: false
    admin:
      auto-create: false
hapbang:
  billing:
    # 나가는 호출 회로(#562)는 컨텍스트 하나를 여러 테스트가 함께 쓴다. 장애를 일부러 만드는 테스트가 쌓여 회로가 열리면
    # 뒤 테스트가 실제 호출 없이 거절되므로, 통합 테스트에서는 실패율로 열리지 않게 한다.
    # 회로가 열리고 닫히는 동작은 작은 설정으로 직접 만든 OutboundCircuitBreakers로 확인하고, 통합 테스트는 상태를 강제로 바꿔 확인한다.
    outbound:
      minimum-number-of-calls: 100000
      sliding-window-size: 100000
