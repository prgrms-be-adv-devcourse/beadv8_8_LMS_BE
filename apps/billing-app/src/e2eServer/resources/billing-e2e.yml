# production app.jar에 포함되지 않는 별도 JVM HTTP E2E 설정.
# datasource URL/username/password와 임시 내부 API 키는 호출한 하네스가 전달한다.
spring:
  application:
    name: billing-e2e-server
  config:
    import:
      - classpath:billing.yml
      - classpath:swagger.yml
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  docker:
    compose:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true
    default-schema: billing
    schemas:
      - billing
  modulith:
    detection-strategy: explicitly-annotated
    events:
      jdbc:
        schema-initialization:
          enabled: true
        schema: billing
      externalization:
        enabled: false
      republish-outstanding-events-on-restart: false
      completion-mode: delete
  kafka:
    listener:
      auto-startup: false
    admin:
      auto-create: false
server:
  address: 127.0.0.1
  port: 0
management:
  health:
    redis:
      enabled: false
  tracing:
    sampling:
      probability: 0
  otlp:
    metrics:
      export:
        enabled: false
hapbang:
  scheduling:
    enabled: false
  e2e:
    key: test-billing-e2e-key
  billing:
    # 강의 대사 E2E는 생성·반환 직후 실제 목록을 읽는다. 운영 기본 10s는 유지하며
    # 확정 대기 시간의 제외·노출 규칙은 billing의 HoldQueryApiTest에서 검증한다.
    hold-query:
      settle-window: 0s
    toss:
      secret-key: ""
    payment-key:
      encryption-key: ""
      hmac-key: ""
    mock-payout:
      enabled: false
    rate-limit:
      write: 1000000
      read: 1000000
      earning: 1000000
  clients:
    member:
      base-url: http://127.0.0.1:9
    lecture:
      base-url: http://127.0.0.1:9
    appearance:
      base-url: http://127.0.0.1:9
