# 앱별 실행 설정. 구조 전환 제약은 docs/architecture/app-modules.md 참고.
spring:
  config:
    import: optional:file:.env[.properties]
  docker:
    compose:
      file: docker/compose.yaml
      lifecycle-management: start-only
  # 로컬 실행에는 Kafka가 없다. 회원 이벤트 리스너와 DLT 토픽 생성을 끈다 (#430).
  kafka:
    listener:
      auto-startup: false
    admin:
      auto-create: false
springdoc:
  swagger-ui:
    path: "/swagger-ui.html"
hapbang:
  internal-api:
    key: "${HAPBANG_INTERNAL_API_KEY:local-placeholder}"
  billing:
    mock-payout:
      enabled: true
  clients:
    member:
      base-url: http://localhost:8081
    lecture:
      base-url: http://localhost:8084
    appearance:
      base-url: http://localhost:8083
server:
  port: "${SERVER_PORT:8082}"
