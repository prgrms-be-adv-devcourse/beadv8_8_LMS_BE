# 앱별 실행 설정. 구조 전환 제약은 docs/architecture/app-modules.md 참고.
# Flyway 이력은 앱 스키마에 둔다. 기존 모놀리스 DB의 이력 전환은 별도 작업이다.
spring:
  application:
    name: billing-app
  config:
    import:
    - classpath:billing.yml
  profiles:
    default: local
  mvc:
    formcontent:
      filter:
        enabled: false
  # 지갑은 Spring Event를 발행하지도 받지도 않는다(회원 이벤트는 Kafka로 받는다, #430). Modulith 이벤트 기록 설정·테이블은 두지 않는다 (#471).
  # 이벤트 기록 자동 설정을 켜 두면 테이블이 없어 종료 때 레지스트리가 조회하다 실패하므로 함께 뺀다.
  autoconfigure:
    exclude:
    - org.springframework.modulith.events.jdbc.JdbcEventPublicationAutoConfiguration
    - org.springframework.modulith.events.config.EventPublicationAutoConfiguration
  modulith:
    detection-strategy: explicitly-annotated
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true
    default-schema: billing
    schemas:
    - billing
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s
  task:
    scheduling:
      pool:
        size: 4
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
hapbang:
  scheduling:
    enabled: true
  internal-api:
    key: "${HAPBANG_INTERNAL_API_KEY:}"
  billing:
    toss:
      secret-key: "${TOSS_PAYMENTS_SECRET_KEY:}"
    payment-key:
      encryption-key: "${BILLING_PAYMENT_KEY_ENCRYPTION_KEY:}"
      hmac-key: "${BILLING_PAYMENT_KEY_HMAC_KEY:}"
  clients:
    member:
      base-url: "${MEMBER_API_BASE_URL}"
    lecture:
      base-url: "${LECTURE_API_BASE_URL}"
    appearance:
      base-url: "${APPEARANCE_API_BASE_URL}"
springdoc:
  swagger-ui:
    csrf:
      enabled: true
