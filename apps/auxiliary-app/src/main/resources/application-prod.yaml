spring:
  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
  # 챗봇 운영 모델은 OpenAI다(#715). 키는 Secret(auxiliary-app-secrets의 OPENAI_API_KEY)으로만 받는다
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: "${OPENAI_API_KEY}"
      chat:
        model: gpt-4o-mini
        temperature: 0.2
      embedding:
        model: text-embedding-3-small
  # ES는 hapbang-platform의 ECK(자체 서명 CA)다. 주소는 ConfigMap(SPRING_ELASTICSEARCH_URIS), 키는 Secret(ES_API_KEY),
  # CA는 hapbang-prod의 ConfigMap elasticsearch-ca를 마운트한 파일이다(docs/deploy/k8s.md "Elasticsearch 앱 접근")
  elasticsearch:
    api-key: "${ES_API_KEY}"
    restclient:
      ssl:
        bundle: elasticsearch
  ssl:
    bundle:
      pem:
        elasticsearch:
          truststore:
            certificate: file:/etc/hapbang/elasticsearch-ca/ca.crt
server:
  forward-headers-strategy: native
logging:
  structured:
    format:
      # 운영 로그는 JSON 한 줄(Boot 내장 logstash 형식)로 쓴다. 필드·MDC 키·조회는 docs/dev/logging.md (#582)
      console: logstash
hapbang:
  notification:
    websocket:
      # 알림 웹소켓 핸드셰이크를 허용할 프론트 출처(chat-app과 같은 값). Gateway route는 N4에서 연다
      allowed-origins: https://hapbang.duckdns.org
    alert:
      # 알림 시작 시각(ND-076·ND-088): 업무 시각이 이보다 이른 사건은 알림을 만들지 않는다. 첫 배포 때 보존 기간(72시간) 안의
      # 과거 사건이 한꺼번에 알림이 되지 않게 한다. 값은 Git 병합 시각이 아니라 N5 첫 운영 배포의 알림 활성화 기준 시각이다.
      # 지금 값은 임시이고 첫 운영 배포 전에 정한다(U20). 한 번 운영에 적용하면 재배포·재시작 때 바꾸지 않는다.
      # 기본값이 없어 빠뜨리거나 시간대 있는 ISO-8601이 아니면 기동에 실패한다
      start-at: 2026-11-11T13:00:00+09:00
  chatbot:
    faq:
      index-name: chatbot-faq-openai-1536
      dimensions: 1536
      # 임시값. 배포 전에 평가셋을 OpenAI로 한 번 돌려 정한다(README "평가")
      similarity-threshold: 0.4
    index:
      lecture-name: chatbot-lectures-openai-1536
      influencer-name: chatbot-influencers-openai-1536
      dimensions: 1536
  search:
    elasticsearch:
      # 검색 role(search-*)의 key. Secret(auxiliary-app-secrets의 ES_SEARCH_API_KEY, #806)
      api-key: "${ES_SEARCH_API_KEY}"
      ssl-bundle: elasticsearch
