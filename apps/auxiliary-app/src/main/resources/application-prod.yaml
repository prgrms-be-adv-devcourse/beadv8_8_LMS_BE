spring:
  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
  # 챗봇 운영 모델은 OpenAI다(#715). 키는 Secret(auxiliary-app-secrets의 OPENAI_API_KEY)으로만 받는다
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: "${OPENAI_API_KEY}"
      chat:
        # OpenAI 호출은 openai-java SDK의 자체 HTTP 클라이언트로 나가서 앱 공통 spring.http.clients.read-timeout(5s)이 걸리지 않는다(#720).
        # 기본은 60s·재시도 3회라 LlmCallGuard가 포기한 뒤에도 호출이 남아 동시 상한을 넘길 수 있다. 가드 상한 중 가장 긴
        # FAQ 스트림(45s)보다 조금 길게 두고, 재시도는 가드가 fallback으로 대신하므로 끈다. 실제로 끊기는지는 직접 잰다(PR 참고)
        timeout: 50s
        max-retries: 0
        model: gpt-4o-mini
        temperature: 0.2
      embedding:
        model: text-embedding-3-small
  # ES는 hapbang-platform의 ECK(자체 서명 CA)다. 주소는 ConfigMap(SPRING_ELASTICSEARCH_URIS), 키는 Secret(ES_API_KEY),
  # CA는 hapbang-prod의 ConfigMap elasticsearch-ca를 마운트한 파일이다(docs/deploy/k8s.md "Elasticsearch 앱 접근")
  elasticsearch:
    api-key: "${ES_API_KEY}"
    restclient:
      ssl:
        bundle: elasticsearch
  ssl:
    bundle:
      pem:
        elasticsearch:
          truststore:
            certificate: file:/etc/hapbang/elasticsearch-ca/ca.crt
server:
  forward-headers-strategy: native
logging:
  structured:
    format:
      # 운영 로그는 JSON 한 줄(Boot 내장 logstash 형식)로 쓴다. 필드·MDC 키·조회는 docs/dev/logging.md (#582)
      console: logstash
hapbang:
  notification:
    websocket:
      # 알림 웹소켓 핸드셰이크를 허용할 프론트 출처(chat-app과 같은 값). Gateway route는 N4에서 연다
      allowed-origins: https://hapbang.duckdns.org
    # 알림 시작 시각(hapbang.notification.alert.start-at, ND-076)은 운영에서 설정하지 않는다. 앱이 처음 뜰 때의 시각을
    # notification.notification_runtime_setting에 한 번 기록해 재배포·재시작에도 그 값을 쓴다(ND-095). 설정하면 그 값이 기록보다 앞선다
  chatbot:
    faq:
      index-name: chatbot-faq-openai-1536
      dimensions: 1536
      # 임시값. 배포 전에 평가셋을 OpenAI로 한 번 돌려 정한다(README "평가")
      similarity-threshold: 0.4
    index:
      lecture-name: chatbot-lectures-openai-1536
      influencer-name: chatbot-influencers-openai-1536
      dimensions: 1536
    # 추천 가중치(#867). OpenAI 임베딩 + 더미 데이터 평가(조정용 80명으로 고르고 확인용 20명으로 한 번 확인)로 정했다.
    # 더미 데이터 기준이라 실사용 데이터가 쌓이면 다시 본다. 근거 표: docs/chatbot/recommend-weights.md
    recommend:
      lecture:
        # 관심사 비율 α와 인기 비율 β. 임베딩 모델마다 유사도가 퍼지는 구간이 달라 프로필마다 둔다(기본값 없음).
        # α 0.3 유지: 0~0.7 모두 hit@5 차이 2명 이하. 0.5는 상위 20개 안 정답이 3명 줄어 리랭킹 여지가 작아진다
        interest-weight: 0.3
        # 자유 질문 Tool의 α(#1007). 임시값(평가 없이 정함): 대화에서 직접 말한 요구가 과거 구매보다 앞서게 위젯·버튼(0.3)보다 높게 둔다
        chat-interest-weight: 0.7
        # 강의 벡터에 섞는 제목 벡터 비율 w(#1007). 임시값(평가 없이 정함): 긴 소개가 제목·주제를 묻는 것을 줄인다(#995).
        # 바꾸면 색인 해시가 달라져 모든 강의를 다시 임베딩한다. 되돌릴 때는 0(제목을 섞지 않는 #1007 전 벡터로 다시 색인)
        title-weight: 0.3
        # β 0.05 → 0.2: 80명 hit@5 0.288 → 0.338. 인기와 무관한 변형 데이터와 합쳐도 손해가 가장 적다. 20명 0.400
        popularity-weight: 0.2
        # 신호 세기 = 기본(구매·장바구니) + 별점 보정이고 0 이하면 신호에서 뺀다(LectureSignals).
        # 아래 1·2점 보정은 구매 1.0을 전제로 정했다. owned·cart를 바꾸면 rating1·rating2도 함께 다시 정한다(ProdRecommendWeightsTest)
        weights:
          # 구매 1.0·장바구니 0.6 유지: 장바구니 0~1.0 중 0.6이 가장 좋고 0이면 3명 줄었다. 코드 기본값과 같지만 위 전제라서 적어 둔다
          owned: 1.0
          cart: 0.6
          # 1점 −0.5 → −1.0: 1점 준 강의는 취향에서 뺀다(구매 1.0 − 1.0 = 0, 그 분야 불호). hit@5는 같고 싫어한 분야 강의가 추천에서 빠진다
          rating1: -1.0
          # 2점 −0.3 → −0.6: 2점은 분야보다 그 강의에 대한 실망이라 약하게(구매 1.0 − 0.6 = 0.4) 남긴다
          rating2: -0.6
      influencer:
        # β 0.2 → 0.1: 상위 20개 안 정답 0.500 → 0.613. 0은 받은 별점이 순서에 안 쓰여 0.1. 20명 hit@5 0.300
        popularity-weight: 0.1
      # 버튼 경로 리랭킹(#948). 같은 평가(gpt-4o-mini)로 정했다. 근거 표: docs/chatbot/recommend-rerank.md
      rerank:
        # none → public: 본인이 이번에 쓴 관심사와 인플루언서의 공개 프로필(분야·자기소개)만 넣는다.
        # 80명 hit@5 강의 0.317 → 0.375, 인플루언서 0.188 → 0.217. 넣을 취향이 없으면 순서를 바꾸지 않는다(취향 없이 바꾸면 손해였다)
        taste: public
        # 비움(0.2) → 0: 고르기라 흔들림의 이득이 없다. 80명 강의 0.375 → 0.383, 인플루언서 3회 결과가 같았다
        temperature: 0
        # 12s → 15s: 평가 최대 11.6s. 쿼리 확장 5s를 더한 LLM 상한 20s에 임베딩·ES를 더해도 Gateway 30s 안
        timeout: 15s
  search:
    elasticsearch:
      # 검색 role(search-*)의 key. Secret(auxiliary-app-secrets의 ES_SEARCH_API_KEY, #806)
      api-key: "${ES_SEARCH_API_KEY}"
      ssl-bundle: elasticsearch
