spring:
  config:
    import: optional:file:.env[.properties]
  docker:
    compose:
      file: docker/compose.yaml
      lifecycle-management: start-only
  # 챗봇 로컬 모델은 Ollama다. ES·Ollama는 apps/auxiliary-app/compose.yaml로 따로 띄운다(README "챗봇 로컬 실행")
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: http://localhost:11434
      init:
        # 모델은 README대로 직접 받는다(qwen2.5:3b 약 2GB). 기동 중에 받지 않는다
        pull-model-strategy: never
      chat:
        # 0.5b는 Tool을 거의 부르지 않는다(교안 부록 B)
        model: qwen2.5:3b
        temperature: 0.2
      embedding:
        model: nomic-embed-text
  elasticsearch:
    uris: http://localhost:9200
hapbang:
  internal-api:
    key: "${HAPBANG_INTERNAL_API_KEY:local-placeholder}"
  clients:
    appearance:
      # 로컬 출연 앱(챗봇 출연 싱크, #716)
      base-url: "${APPEARANCE_API_BASE_URL:http://localhost:8083}"
  chatbot:
    faq:
      index-name: chatbot-faq-ollama-768
      dimensions: 768
      # nomic-embed-text는 문서·질문에 작업 접두어를 붙여야 검색 품질이 나온다
      document-prefix: "search_document: "
      query-prefix: "search_query: "
      # 로컬은 호출이 되는지만 보는 개발용이다. 2026-11-09 평가에서 0.70 이하 어느 값도 범위 밖 질문을 거르지 못해
      # (nomic-embed-text가 한국어에 약함) 품질로 정하지 않고 검색 결과가 나오는 값으로 둔다(README "테스트와 평가")
      similarity-threshold: 0.6
server:
  port: "${SERVER_PORT:8087}"
