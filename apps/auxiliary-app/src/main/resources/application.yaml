# auxiliary-app 실행 설정(#714). 구조는 apps/auxiliary-app/README.md.
# database 하나를 모듈이 schema로 나눠 쓴다. Flyway 이력·Modulith 발행 기록은 앱 공통 schema(auxiliary)에 두고,
# 업무 테이블은 모듈 schema(chatbot 등)에 둔다.
spring:
  application:
    name: auxiliary-app
  config:
    import:
    - classpath:swagger.yml
  profiles:
    default: local
  autoconfigure:
    # 앱은 Gateway 사용자 헤더와 내부 API 키로 인증해 UserDetailsService가 없다. 빼지 않으면 Boot가 기본 사용자(user)를 만들고
    # 생성 비밀번호를 기동 로그(WARN)에 남긴다(#733, #742). 프로필 파일에서 이 목록을 다시 쓰면 합쳐지지 않고 바뀐다
    exclude:
    - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  mvc:
    formcontent:
      filter:
        enabled: false
    async:
      # SSE 스트림(챗봇 FAQ 대화 등)의 MVC 비동기 상한. 서버 스트림 상한(hapbang.chatbot.faq.stream-timeout 45s)보다 길고
      # Gateway 스트림 route(60s)보다 짧게 둔다. 그래야 서버의 fallback·error 이벤트가 먼저 나간다(#715)
      request-timeout: 50s
  modulith:
    # @ApplicationModule을 붙인 패키지만 모듈로 본다
    detection-strategy: explicitly-annotated
    events:
      jdbc:
        schema-initialization:
          enabled: true
        schema: auxiliary
      republish-outstanding-events-on-restart: true
      completion-mode: archive
  datasource:
    hikari:
      # PostgreSQL max_connections(100)를 다른 앱과 나눠 쓴다. 다른 앱(기본 10)보다 작게 둔다
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    # 모듈 SQL은 각 모듈의 src/main/resources/db/migration에 있고 클래스패스에서 합쳐진다. 버전은 작성 시각이라,
    # 먼저 작성했지만 늦게 병합된 SQL이 이미 적용된 버전보다 낮을 수 있다. 모듈은 서로 의존하지 않으므로 낮은 버전도 실행한다
    out-of-order: true
    default-schema: auxiliary
    schemas:
    - auxiliary
  # Spring AI(챗봇, #715). 공급자는 프로필 파일에서 하나만 켠다(local=ollama, prod=openai). 여기서는 모두 끈다.
  # 모델을 끈 실행(앱 전체 테스트 등)에서 챗봇은 LLM 없이 답하고(fallback) FAQ 색인·검색을 하지 않는다
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    # Spring AI 자동 설정의 vector store 빈은 만들어질 때 ES를 불러 ES가 죽어 있으면 앱이 뜨지 않는다.
    # 챗봇이 직접 만든다(FaqVectorIndex)
    vectorstore:
      type: none
      observations:
        log-query-response: false
    # 사용자 메시지·답변 본문을 로그·trace에 남기지 않는다(docs/dev/logging.md)
    chat:
      observations:
        log-prompt: false
        log-completion: false
        include-error-logging: false
      client:
        observations:
          log-prompt: false
          log-completion: false
    tools:
      observations:
        include-content: false
  # Elasticsearch(챗봇 FAQ 색인, #715). 주소·인증은 프로필 파일에서 정한다. ES가 죽어도 앱은 뜨고 챗봇만 검색 없이 답한다.
  # ES 헬스 지표는 전체 상태(/actuator/health)에만 들어가고 liveness·readiness 그룹에는 들어가지 않는다
  elasticsearch:
    connection-timeout: 1s
    socket-timeout: 10s
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s
  task:
    scheduling:
      pool:
        size: 2
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      # 응답 시간 p50·p95·p99를 histogram_quantile로 계산할 bucket 경계(#617). 다른 앱과 같다
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1000ms,2500ms,5000ms
        http.server.requests.active: ""
  # trace(#631). Envoy를 거친 요청은 Envoy의 샘플링 결정을 따르고, 아래 비율은 앱 안에서 시작하는 trace에만 쓴다
  tracing:
    sampling:
      probability: 0.1
  opentelemetry:
    tracing:
      export:
        otlp:
          # Alloy는 OTLP gRPC(4317)만 받는다. endpoint는 k8s ConfigMap이 넣고, 없으면(로컬·테스트) 보내지 않는다
          transport: grpc
  otlp:
    metrics:
      export:
        # 지표는 Prometheus가 /actuator/prometheus로 수집한다
        enabled: false
hapbang:
  scheduling:
    enabled: true
  chatbot:
    faq:
      # 공급자별 값은 프로필 파일에 있다. 아래는 모델을 끈 실행용 값이다(색인·검색을 하지 않는다)
      index-name: chatbot-faq-none
      dimensions: 768
      similarity-threshold: 0.7
  internal-api:
    key: "${HAPBANG_INTERNAL_API_KEY:}"
