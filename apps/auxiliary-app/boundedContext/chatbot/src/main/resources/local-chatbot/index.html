<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>챗봇 로컬 확인</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 860px; margin: 24px auto; padding: 0 16px; }
        fieldset { margin-bottom: 12px; }
        input[type=text] { width: 60%; }
        #log { white-space: pre-wrap; background: #f4f4f4; padding: 12px; min-height: 160px; font-size: 13px; }
        .bubble { margin: 6px 0; padding: 8px; border-radius: 6px; }
        .USER { background: #e3f0ff; }
        .ASSISTANT { background: #eef8e8; }
        small { color: #666; }
    </style>
</head>
<body>
<h1>챗봇 로컬 확인 (#720)</h1>
<p><small>local 프로필 전용 화면이다. 로컬에는 Gateway가 없어 아래 회원 ID·역할을 사용자 헤더(X-User-Id, X-User-Role)로 직접 싣는다.
    대화는 이 화면에만 있고 새로고침하면 사라진다(서버는 저장하지 않는다).</small></p>

<fieldset>
    <legend>회원</legend>
    회원 ID <input id="userId" value="1" size="6">
    역할 <select id="role"><option>USER</option><option>INFLUENCER</option><option>VERIFIED_INFLUENCER</option></select>
</fieldset>

<fieldset>
    <legend>시작 버튼</legend>
    관심사(선택) <input id="interest" type="text" placeholder="예: 데이터 분석 입문">
    <div>
        <button onclick="call('GET', '/api/v1/chatbot/faqs')">FAQ 모아보기</button>
        <button onclick="callButton('/api/v1/chatbot/recommendations/lectures/explained')">강의 추천받기</button>
        <button onclick="callButton('/api/v1/chatbot/recommendations/influencers/explained')">인플루언서 추천받기</button>
    </div>
</fieldset>

<fieldset>
    <legend>자유 질문하기</legend>
    <div id="chat"></div>
    <input id="message" type="text" placeholder="질문을 입력한다">
    <label><input id="useStream" type="checkbox" checked> 스트림(SSE)</label>
    <button onclick="ask()">보내기</button>
    <button onclick="history = []; render()">대화 비우기</button>
</fieldset>

<h3>응답</h3>
<div id="log"></div>

<script>
    let history = [];

    function headers(json) {
        const h = { 'X-User-Id': document.getElementById('userId').value, 'X-User-Role': document.getElementById('role').value };
        if (json) {
            h['Content-Type'] = 'application/json';
        }
        return h;
    }

    function log(text) {
        document.getElementById('log').textContent = text;
    }

    async function call(method, path, body) {
        const started = performance.now();
        const response = await fetch(path, { method, headers: headers(body !== undefined), body: body === undefined ? undefined : JSON.stringify(body) });
        const text = await response.text();
        const elapsed = Math.round(performance.now() - started);
        let pretty = text;
        try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch (e) { /* 글 그대로 */ }
        log(`${method} ${path} → ${response.status} (${elapsed}ms)\n\n${pretty}`);
        return response.ok ? JSON.parse(text) : null;
    }

    function callButton(path) {
        const interest = document.getElementById('interest').value.trim();
        return call('POST', path, interest ? { interest } : {});
    }

    function render() {
        const chat = document.getElementById('chat');
        chat.innerHTML = '';
        for (const entry of history) {
            const div = document.createElement('div');
            div.className = 'bubble ' + entry.role;
            div.textContent = entry.role + ': ' + entry.content;
            chat.appendChild(div);
        }
    }

    async function ask() {
        const input = document.getElementById('message');
        const message = input.value.trim();
        if (!message) {
            return;
        }
        input.value = '';
        // 이전 대화만 보낸다. 배열을 복사해 두지 않으면 아래 push가 보낼 본문까지 바꿔 지금 질문이 history에 한 번 더 들어간다
        const body = { message, history: [...history] };
        history.push({ role: 'USER', content: message });
        render();
        const answer = document.getElementById('useStream').checked ? await askStream(body) : await askOnce(body);
        if (answer) {
            history.push({ role: 'ASSISTANT', content: answer });
            render();
        }
    }

    async function askOnce(body) {
        const result = await call('POST', '/api/v1/chatbot/messages', body);
        return result ? result.data.answer : null;
    }

    // SSE를 fetch로 읽는다(POST라 EventSource를 쓸 수 없다). 이벤트를 받는 대로 응답 칸에 적는다
    async function askStream(body) {
        const started = performance.now();
        const response = await fetch('/api/v1/chatbot/messages/stream',
            { method: 'POST', headers: { ...headers(true), 'Accept': 'text/event-stream' }, body: JSON.stringify(body) });
        if (!response.ok) {
            log(`POST /messages/stream → ${response.status}\n\n${await response.text()}`);
            return null;
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let answer = '';
        const events = [];
        while (true) {
            const { done, value } = await reader.read();
            if (done) {
                break;
            }
            buffer += decoder.decode(value, { stream: true });
            let cut;
            while ((cut = buffer.indexOf('\n\n')) >= 0) {
                const block = buffer.slice(0, cut);
                buffer = buffer.slice(cut + 2);
                const name = (block.match(/^event:(.*)$/m) || [])[1]?.trim();
                const data = (block.match(/^data:(.*)$/m) || [])[1];
                if (!name || data === undefined) {
                    continue;
                }
                const parsed = JSON.parse(data);
                if (name === 'token') {
                    answer += parsed.text;
                } else {
                    events.push(`${name}: ${JSON.stringify(parsed, null, 2)}`);
                }
                log(`POST /messages/stream (${Math.round(performance.now() - started)}ms)\n\n답: ${answer}\n\n${events.join('\n\n')}`);
            }
        }
        return answer || null;
    }
</script>
</body>
</html>
