# 검색 모듈 테스트 전용 설정. @IntegrationTest가 spring.config.name=hapbang-module-test로 읽는다.
# src/test 아래라 배포 jar에는 포함되지 않는다.
spring:
  datasource:
    hikari:
      # 테스트는 컨텍스트를 여러 개 캐시하고 각 컨텍스트가 연결 풀을 가진다. PostgreSQL 컨테이너의 max_connections(100)를 넘지 않게 줄인다
      maximum-pool-size: 5
hapbang:
  search:
    # 시작할 때 index를 만드는 스레드가 다른 테스트의 ES 정리와 겹치지 않게 끈다. 준비는 테스트가 직접 부른다
    setup-on-startup: false
    # 대부분의 테스트에는 Kafka가 없다. 회원 이벤트 소비자는 Kafka 시험 클래스만 켠다
    member-events:
      enabled: false
    # 강의 이벤트 소비자도 Kafka 시험 클래스만 켠다(#882)
    lecture-events:
      enabled: false
    elasticsearch:
      # ES를 쓰는 테스트는 SearchElasticsearchTestcontainersConfig를 @Import 해 이 주소를 컨테이너 주소로 바꾼다.
      # ES가 없는 테스트는 닿지 않는 주소로 둔다(연결 거절을 바로 받는다)
      uris: http://127.0.0.1:9
  clients:
    member:
      # 통계 동기화가 부르는 회원 내부 API. 모듈 테스트는 부르지 않거나 가짜 소스로 바꾼다(닿지 않는 주소)
      base-url: http://127.0.0.1:9
