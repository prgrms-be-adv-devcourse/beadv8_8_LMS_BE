# Swagger(springdoc) 설정. application.yaml과 테스트 설정(hapbang-module-test.yaml)이 함께 import해서
# 테스트가 실제 경로·운영 값을 그대로 검사한다.
# 이 앱에는 챗봇·검색·알림 모듈이 함께 있어 명세도 하나다. 어느 모듈 경로도 아닌 앱 경로(/api/v1/auxiliary) 아래에 두고,
# Gateway가 이 경로를 이 앱으로 보낸다(k8s/base/gateway.yaml). 모듈 API는 컨트롤러 @Tag로 나눈다.
# 경로를 바꾸면 SecurityConfig의 Swagger permitAll도 함께 바꾼다.
springdoc:
  api-docs:
    path: /api/v1/auxiliary/v3/api-docs
  swagger-ui:
    path: /api/v1/auxiliary/swagger-ui.html
---
# 운영: 누구나 본다. 같은 도메인의 7개 앱 명세를 상단 목록에서 고르고(#894), Authorize 버튼은 access token(Bearer)으로 받는다
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    # 목록은 이름 가나다순으로 보인다. 자기 앱은 자동으로 들어가지 않으므로 7개를 모두 적는다.
    # 다른 앱 6개의 swagger.yml에도 같은 목록이 있다. 앱을 더하거나 이름을 바꾸면 모두 함께 고친다
    urls:
    - name: 회원
      url: /api/v1/members/v3/api-docs
    - name: 강의
      url: /api/v1/lectures/v3/api-docs
    - name: 출연
      url: /api/v1/appearances/v3/api-docs
    - name: 지갑
      url: /api/v1/wallets/v3/api-docs
    - name: 채팅
      url: /api/v1/chats/v3/api-docs
    - name: 고객센터
      url: /api/v1/inquiries/v3/api-docs
    - name: 검색·챗봇·알림
      url: /api/v1/auxiliary/v3/api-docs
    urls-primary-name: 검색·챗봇·알림
  # 명세는 언어(Accept-Language)마다 따로 만들어 캐시한다. 누구나 부르므로 언어를 하나로 묶어 캐시를 1개로 둔다
  allowed-locales:
  - ko-KR
hapbang:
  swagger:
    bearer-auth:
      enabled: true
