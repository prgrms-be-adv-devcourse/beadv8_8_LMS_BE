# 로컬 k3d(2노드) 검증용. pod 기동과 메모리만 확인한다(docs/deploy/k8s.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hapbang-prod
resources:
  - ../../base
# 로컬에서 빌드해 k3d image import로 넣은 이미지.
images:
  - name: auxiliary-app
    newName: hapbang/auxiliary-app
    newTag: local
# 로컬 전용 가짜 값이다. prod 값은 SealedSecret으로만 만든다.
# DB_PASSWORD는 k8s/platform/overlays/local의 postgres-credentials와 같아야 한다(auxiliary 키는 인프라 작업에서 더한다).
# prod와 같은 Secret 이름을 쓰도록 hash를 붙이지 않는다.
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: auxiliary-app-secrets
    literals:
      - DB_PASSWORD=local-auxiliary-password
      - HAPBANG_INTERNAL_API_KEY=local-internal-api-key
      # 운영 프로필이 값을 요구한다(#715). 가짜 값이라 챗봇 LLM·ES 호출은 실패하고 fallback으로 답한다
      - OPENAI_API_KEY=local-placeholder
      - ES_API_KEY=local-placeholder
      # 검색 key(#806). 검색 기능 스위치가 켜졌을 때만 운영 프로필이 읽는다
      - ES_SEARCH_API_KEY=local-placeholder
