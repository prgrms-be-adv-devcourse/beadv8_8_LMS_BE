# 모듈 경로(챗봇 /api/v1/chatbot, 검색 /api/v1/search #771, 알림 /api/v1/notifications #847)와 앱 하나의 Swagger 경로(/api/v1/auxiliary)를 연다.
# 챗봇 SSE 스트림(/api/v1/chatbot/**/stream)은 아래 auxiliary-app-stream route로 따로 나눠 시간 상한을 60초로 둔다(#715).
# 알림 웹소켓 연결(GET /api/v1/notifications/ws)은 아래 auxiliary-app-notification-websocket route로 따로 나눈다(#847).
# 연결 티켓 발급(POST /api/v1/notifications/ws-tickets)은 이 route라 JWT 검증과 exp claim을 받는다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auxiliary-app
spec:
  parentRefs:
  - name: hapbang
    namespace: envoy-gateway-system
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/chatbot
    - path:
        type: PathPrefix
        value: /api/v1/search
    - path:
        type: PathPrefix
        value: /api/v1/auxiliary
    - path:
        type: PathPrefix
        value: /api/v1/notifications
    backendRefs:
    - name: auxiliary-app
      port: 8080
    timeouts:
      request: 30s
      backendRequest: 30s
---
# 챗봇 SSE 스트림(#715). timeouts.request는 응답이 끝날 때까지의 전체 시간이라 30초면 긴 답을 끊는다. 이 경로만 60초다.
# 서버 스트림 상한(45s)과 MVC 비동기 상한(50s)이 이보다 짧아 서버의 fallback·error 이벤트가 먼저 나간다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auxiliary-app-stream
spec:
  parentRefs:
  - name: hapbang
    namespace: envoy-gateway-system
    sectionName: https
  rules:
  - matches:
    - path:
        type: RegularExpression
        value: ^/api/v1/chatbot/.+/stream$
      method: POST
    backendRefs:
    - name: auxiliary-app
      port: 8080
    timeouts:
      request: 60s
      backendRequest: 60s
---
# 알림 웹소켓 연결(#847). GET이면서 경로가 정확히 이 값일 때만 맞는다. 전체 시간 제한은 없고 stream idle은 아래 정책의 5분이다.
# 앱이 STOMP heart-beat(25초)를 보내 알림이 없어도 idle에 끊기지 않고, 연결 만료(최대 15분)에 앱이 4401로 닫는다.
# 아래 JWT SecurityPolicy의 대상이 아니다. 브라우저는 웹소켓 업그레이드에 Authorization을 싣지 못하므로 연결은 앱의 1회용 티켓으로만
# 인증한다(티켓이 없거나 틀리면 앱이 401). 외부에서 보낸 사용자 헤더는 공용 Gateway의 earlyRequestHeaders가 모든 route에서 지운다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auxiliary-app-notification-websocket
spec:
  parentRefs:
  - name: hapbang
    namespace: envoy-gateway-system
    sectionName: https
  rules:
  - matches:
    - path:
        type: Exact
        value: /api/v1/notifications/ws
      method: GET
    backendRefs:
    - name: auxiliary-app
      port: 8080
    timeouts:
      request: 0s
      backendRequest: 0s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: auxiliary-app
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: auxiliary-app
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: auxiliary-app-stream
  jwt:
    optional: true
    providers:
    - name: member
      issuer: https://gateway.invalid
      remoteJWKS:
        uri: http://member-app.hapbang-prod.svc.cluster.local:8080/api/v1/members/.well-known/jwks.json
      # 토큰은 Authorization: Bearer에서만 읽는다. 비워 두면 access_token query도 받아 토큰이 URL에 남는다
      extractFrom:
        headers:
        - name: Authorization
          valuePrefix: "Bearer "
      claimToHeaders:
      - claim: sub
        header: X-User-Id
      - claim: role
        header: X-User-Role
      # access token의 exp(epoch 초 정수, Envoy는 숫자 claim도 문자열로 넘긴다). 알림 연결 티켓 발급만 읽어 연결 만료에 쓰고
      # 발급 시각 + 15분으로 상한을 둔다(#847). 챗봇·검색은 읽지 않는다. 외부에서 붙인 같은 헤더는 공용 Gateway가 지운다
      - claim: exp
        header: X-User-Token-Exp
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: auxiliary-app-notification-websocket
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: auxiliary-app-notification-websocket
  timeout:
    http:
      requestTimeout: 0s
      # 알림 앱의 heart-beat 상한(NotificationWebSocketConfig.MAX_HEARTBEAT)과 같은 값이다. 바꾸면 함께 바꾼다(ND-068)
      streamIdleTimeout: 300s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: auxiliary-app-body-limit
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: auxiliary-app
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: auxiliary-app-stream
  requestBuffer:
    limit: 1Mi
