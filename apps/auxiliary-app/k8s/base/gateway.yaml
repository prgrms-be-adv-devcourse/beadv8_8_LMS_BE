# 모듈 경로(챗봇 /api/v1/chatbot, 검색 /api/v1/search #771)와 앱 하나의 Swagger 경로(/api/v1/auxiliary)를 연다.
# 알림 모듈을 더할 때 그 모듈 경로를 matches에 더한다(apps/auxiliary-app/README.md).
# 챗봇 SSE 스트림(/api/v1/chatbot/**/stream)은 아래 auxiliary-app-stream route로 따로 나눠 시간 상한을 60초로 둔다(#715).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auxiliary-app
spec:
  parentRefs:
  - name: hapbang
    namespace: envoy-gateway-system
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/chatbot
    - path:
        type: PathPrefix
        value: /api/v1/search
    - path:
        type: PathPrefix
        value: /api/v1/auxiliary
    backendRefs:
    - name: auxiliary-app
      port: 8080
    timeouts:
      request: 30s
      backendRequest: 30s
---
# 챗봇 SSE 스트림(#715). timeouts.request는 응답이 끝날 때까지의 전체 시간이라 30초면 긴 답을 끊는다. 이 경로만 60초다.
# 서버 스트림 상한(45s)과 MVC 비동기 상한(50s)이 이보다 짧아 서버의 fallback·error 이벤트가 먼저 나간다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auxiliary-app-stream
spec:
  parentRefs:
  - name: hapbang
    namespace: envoy-gateway-system
    sectionName: https
  rules:
  - matches:
    - path:
        type: RegularExpression
        value: ^/api/v1/chatbot/.+/stream$
      method: POST
    backendRefs:
    - name: auxiliary-app
      port: 8080
    timeouts:
      request: 60s
      backendRequest: 60s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: auxiliary-app
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: auxiliary-app
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: auxiliary-app-stream
  jwt:
    optional: true
    providers:
    - name: member
      issuer: https://gateway.invalid
      remoteJWKS:
        uri: http://member-app.hapbang-prod.svc.cluster.local:8080/api/v1/members/.well-known/jwks.json
      # 토큰은 Authorization: Bearer에서만 읽는다. 비워 두면 access_token query도 받아 토큰이 URL에 남는다
      extractFrom:
        headers:
        - name: Authorization
          valuePrefix: "Bearer "
      claimToHeaders:
      - claim: sub
        header: X-User-Id
      - claim: role
        header: X-User-Role
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: auxiliary-app-body-limit
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: auxiliary-app
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: auxiliary-app-stream
  requestBuffer:
    limit: 1Mi
