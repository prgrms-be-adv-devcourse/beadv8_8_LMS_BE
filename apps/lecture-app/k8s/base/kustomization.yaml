# lecture-app의 기본 manifest. 레포를 나눠도 앱 디렉터리만으로 빌드·배포할 수 있게 앱 안에 둔다.
# 공용 인프라(PostgreSQL·Kafka·Redis)는 루트 k8s/platform에 있고 아래 주소로만 연결한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hapbang-prod
resources:
  - deployment.yaml
  - service.yaml
  - gateway.yaml
  - networkpolicy.yaml
# 이름에 내용 hash가 붙으므로 값을 바꾸면 앱이 다시 배포되고, rollout undo가 이전 ConfigMap까지 되돌린다.
configMapGenerator:
  - name: lecture-app-config
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=Asia/Seoul
      - HAPBANG_INTERNAL_API_PORT=8081
      # actuator(헬스체크·Prometheus 지표)는 관리 포트로만 연다. 앱이 Gateway 사용자 헤더를 믿으므로 8080에는 Gateway만 들인다(#521, D72)
      - MANAGEMENT_SERVER_PORT=8082
      # heap 상한을 limit 비율(MaxRAMPercentage=60, 704Mi면 약 410Mi)이 아니라 고정값으로 둔다. heap 사용은 운영 7일 최대 164Mi,
      # Tenured 사용은 최대 76Mi다. 비율로 두면 heap 상한 + heap 밖(약 394Mi)이 limit을 넘는다(#727, #610).
      # chat-app의 256m(heap 사용 최대의 약 1.5배)이 아니라 224m인 것은 heap committed(약 244Mi)를 224Mi 이하로 묶기 위해서다.
      # working set은 약 20Mi 줄어 약 626Mi(89%)로 예상한다. 634Mi(90%)를 넘으면 limit 상향과 -Xmx 하향 중에서 다시 정한다.
      - JAVA_TOOL_OPTIONS=-Xmx224m
      # glibc malloc arena 수를 줄여 heap 밖 native 메모리를 줄인다. 기본값은 CPU 수 × 8이다(#610).
      - MALLOC_ARENA_MAX=2
      - DB_URL=jdbc:postgresql://postgres.hapbang-platform.svc.cluster.local:5432/lecture
      - DB_USERNAME=lecture
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka.hapbang-platform.svc.cluster.local:9092
      - SPRING_DATA_REDIS_HOST=redis.hapbang-platform.svc.cluster.local
      - BILLING_API_BASE_URL=http://billing-app:8081
      # trace를 Alloy(OTLP gRPC)로 보낸다. Alloy가 Tempo로 넘긴다(#579). service name은 spring.application.name(lecture-app)이다
      - MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://alloy.hapbang-platform.svc.cluster.local:4317
