apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lecture-app
spec:
  parentRefs:
  - name: hapbang
    namespace: envoy-gateway-system
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/lectures
    backendRefs:
    - name: lecture-app
      port: 8080
    timeouts:
      request: 30s
      backendRequest: 30s
---
# Swagger 경로만 따로 연다(#541). 앱이 permitAll로 여는 GET 경로뿐이라 JWT 검증(SecurityPolicy)을 걸지 않는다.
# 외부가 보낸 X-User-* 헤더는 모든 route에서 ClientTrafficPolicy가 먼저 지운다.
# 강의 API(lecture-app route)를 열기 전에 이 route만 운영에 적용해 Swagger를 먼저 공개했다. 그 뒤에도 같은 앱으로 가므로 그대로 둔다
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lecture-app-swagger
spec:
  parentRefs:
  - name: hapbang
    namespace: envoy-gateway-system
    sectionName: https
  rules:
  - matches:
    # PathPrefix는 경로 조각 단위로 비교해 swagger-ui.html을 잡지 못하므로 Exact로 둔다
    - path:
        type: Exact
        value: /api/v1/lectures/swagger-ui.html
      method: GET
    - path:
        type: PathPrefix
        value: /api/v1/lectures/swagger-ui
      method: GET
    - path:
        type: PathPrefix
        value: /api/v1/lectures/v3/api-docs
      method: GET
    backendRefs:
    - name: lecture-app
      port: 8080
    timeouts:
      request: 30s
      backendRequest: 30s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lecture-app-upload
spec:
  parentRefs:
  - name: hapbang
    namespace: envoy-gateway-system
    sectionName: https
  rules:
  - matches:
    - path:
        type: RegularExpression
        value: ^/api/v1/lectures/files/[0-9]+/content$
      method: PUT
    backendRefs:
    - name: lecture-app
      port: 8080
    timeouts:
      request: 1800s
      backendRequest: 1800s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: lecture-app
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: lecture-app
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: lecture-app-upload
  jwt:
    optional: true
    providers:
    - name: member
      issuer: https://gateway.invalid
      remoteJWKS:
        uri: http://member-app.hapbang-prod.svc.cluster.local:8080/api/v1/members/.well-known/jwks.json
      # 토큰은 Authorization: Bearer에서만 읽는다(#508). 비워 두면 access_token query도 받아 토큰이 URL에 남는다
      extractFrom:
        headers:
        - name: Authorization
          valuePrefix: "Bearer "
      claimToHeaders:
      - claim: sub
        header: X-User-Id
      - claim: role
        header: X-User-Role
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: lecture-app-body-limit
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: lecture-app
  requestBuffer:
    limit: 1Mi
