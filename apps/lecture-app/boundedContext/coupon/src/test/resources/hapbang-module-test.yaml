# 쿠폰 모듈 테스트 전용 설정. src/test 아래라 배포 jar에는 포함되지 않는다. 운영 설정은 lecture-app이 가진다.
spring:
  kafka:
    # 대부분의 쿠폰 테스트에는 Kafka가 없다. 발급 확정 리스너가 연결을 계속 시도하거나 토픽 선언(쿠폰 이벤트·DLT)이 broker를 기다리며
    # 컨텍스트 기동을 늦추지 않게 끈다. Kafka를 쓰는 테스트(KafkaTestcontainersConfig)만 @TestPropertySource로 다시 켠다.
    listener:
      auto-startup: false
    admin:
      auto-create: false
