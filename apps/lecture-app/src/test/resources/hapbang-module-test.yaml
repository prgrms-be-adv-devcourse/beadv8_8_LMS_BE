# 강의 모듈 테스트 전용 설정. src/test 아래라 배포 jar에는 포함되지 않는다.
spring:
  config:
    # 운영 application.yaml을 읽지 않는 모듈 테스트에도 강의 설정(Kafka 직렬화)과 Swagger 설정은 그대로 가져온다.
    # Swagger는 실제 경로·운영 값을 검사한다 (#498)
    import:
    - classpath:lecture.yml
    - classpath:swagger.yml
  modulith:
    events:
      # 강의 이벤트의 Kafka 외부화(#278)는 끈다. Kafka 브로커가 없는 테스트에서 보내기를 시도하지 않게 한다.
      # Kafka 발행은 LectureEventKafkaTest가 Testcontainers Kafka와 함께 켜서 확인한다
      externalization:
        enabled: false
  kafka:
    # 대부분의 테스트에는 Kafka가 없다. 리스너가 연결을 계속 시도하거나 토픽 생성이 시간 초과를 기다리지 않게 끈다.
    # Kafka 테스트(LectureMemberEventListenerTest, LectureObjectionRequestListenerTest, LectureEventKafkaTest)만
    # KafkaTestcontainersConfig와 함께 다시 켠다.
    listener:
      auto-startup: false
    admin:
      auto-create: false
