# 앱별 실행 설정. 구조 전환 제약은 docs/architecture/app-modules.md 참고.
spring:
  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
hapbang:
  storage:
    s3:
      bucket: "${S3_BUCKET}"
      key-prefix: prod
server:
  forward-headers-strategy: native
logging:
  structured:
    format:
      # 운영 로그는 JSON 한 줄(Boot 내장 logstash 형식)로 쓴다. 로컬·테스트는 평문이다. 필드·MDC 키·조회는 docs/dev/logging.md (#582)
      console: logstash
