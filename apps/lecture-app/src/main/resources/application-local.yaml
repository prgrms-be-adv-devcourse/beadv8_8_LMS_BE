# 앱별 실행 설정. 구조 전환 제약은 docs/architecture/app-modules.md 참고.
spring:
  config:
    import: optional:file:.env[.properties]
  docker:
    compose:
      file: docker/compose.yaml
      lifecycle-management: start-only
  # 로컬 compose(docker/compose.yaml)에는 Kafka가 없다. 회원 이벤트 리스너와 DLT 토픽 생성이 연결을 계속 시도하지 않게 끈다.
  # Kafka를 띄워 회원 이벤트 소비를 확인할 때는 SPRING_KAFKA_LISTENER_AUTO_STARTUP·SPRING_KAFKA_ADMIN_AUTO_CREATE를 true로 준다.
  kafka:
    listener:
      auto-startup: false
    admin:
      auto-create: false
springdoc:
  swagger-ui:
    path: "/swagger-ui.html"
hapbang:
  storage:
    s3:
      endpoint: "${S3_ENDPOINT:http://localhost:9090}"
      bucket: "${S3_BUCKET:hapbang-local}"
      key-prefix: local
  internal-api:
    key: "${HAPBANG_INTERNAL_API_KEY:local-placeholder}"
  clients:
    billing:
      base-url: http://localhost:8082
server:
  port: "${SERVER_PORT:8084}"
