# 앱별 실행 설정. 구조 전환 제약은 docs/architecture/app-modules.md 참고.
spring:
  config:
    import: optional:file:.env[.properties]
  docker:
    compose:
      file: docker/compose.yaml
      lifecycle-management: start-only
springdoc:
  swagger-ui:
    path: "/swagger-ui.html"
hapbang:
  storage:
    s3:
      endpoint: "${S3_ENDPOINT:http://localhost:9090}"
      bucket: "${S3_BUCKET:hapbang-local}"
      key-prefix: local
  internal-api:
    key: "${HAPBANG_INTERNAL_API_KEY:local-placeholder}"
server:
  port: "${SERVER_PORT:8084}"
