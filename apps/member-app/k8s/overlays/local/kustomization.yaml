# 로컬 k3d(2노드) 검증용. 실제 로그인·결제·S3는 하지 않고 pod 기동과 메모리만 확인한다(docs/deploy/k8s.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hapbang-prod
resources:
  - ../../base
# 로컬에서 빌드해 k3d image import로 넣은 이미지.
images:
  - name: member-app
    newName: hapbang/member-app
    newTag: local
# 로컬 전용 가짜 값이다. prod 값은 SealedSecret으로만 만든다.
# DB_PASSWORD는 k8s/platform/overlays/local의 postgres-credentials와 같아야 한다.
# prod와 같은 Secret 이름을 쓰도록 hash를 붙이지 않는다. 아래 ConfigMap은 base처럼 hash를 붙여야 해서
# 전체 generatorOptions가 아니라 이 Secret에만 옵션을 둔다(#500).
secretGenerator:
  - name: member-app-secrets
    literals:
      - DB_PASSWORD=local-member-password
      - HAPBANG_INTERNAL_API_KEY=local-internal-api-key
      - S3_BUCKET=local-dummy-bucket
      - GOOGLE_CLIENT_ID=local-dummy
      - GOOGLE_CLIENT_SECRET=local-dummy
      - CHZZK_CLIENT_ID=local-dummy
      - CHZZK_CLIENT_SECRET=local-dummy
      - CHZZK_REDIRECT_URI=http://localhost/api/v1/members/channels/chzzk/callback
      - MAIL_USERNAME=local-dummy@example.com
      - MAIL_PASSWORD=local-dummy
    options:
      disableNameSuffixHash: true
# base가 prod 프로필이라 개인 키(JWT_PRIVATE_KEY) 없이는 member-app이 뜨지 않는다. 로컬은 시작할 때마다 임시 서명 키를 만든다(#500).
# 공개 레포라 가짜라도 개인 키는 커밋하지 않는다. prod overlay에는 이 값이 없어 키가 빠지면 시작이 막힌다.
configMapGenerator:
  - name: member-app-config
    behavior: merge
    literals:
      - HAPBANG_JWT_ALLOW_EPHEMERAL_KEY=true
      # 가입·재설정 인증 메일을 Gmail로 보내지 않고 로그로 남긴다(#557). prod 프로필이라 켜지 않으면 가짜 계정으로 Gmail에 붙다가 실패한다
      - HAPBANG_MEMBER_MAIL_LOG_ONLY=true
