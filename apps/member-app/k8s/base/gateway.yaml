apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: member-app
spec:
  parentRefs:
  - name: hapbang
    namespace: envoy-gateway-system
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/members
    backendRefs:
    - name: member-app
      port: 8080
    timeouts:
      request: 30s
      backendRequest: 30s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: member-app-upload
spec:
  parentRefs:
  - name: hapbang
    namespace: envoy-gateway-system
    sectionName: https
  rules:
  - matches:
    - path:
        type: RegularExpression
        value: ^/api/v1/members/files/[0-9]+/content$
    backendRefs:
    - name: member-app
      port: 8080
    timeouts:
      request: 1800s
      backendRequest: 1800s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: member-app
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: member-app
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: member-app-upload
  jwt:
    optional: true
    providers:
    - name: member
      issuer: https://gateway.invalid
      remoteJWKS:
        uri: http://member-app.hapbang-prod.svc.cluster.local:8080/api/v1/members/.well-known/jwks.json
      claimToHeaders:
      - claim: sub
        header: X-User-Id
      - claim: role
        header: X-User-Role
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: member-app-upload
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: member-app-upload
  lua:
  - type: Inline
    inline: |
      function envoy_on_request(handle)
        local h = handle:headers()
        if h:get(":method") ~= "PUT" then
          handle:respond({[":status"] = "403"}, "")
          return
        end
        local content_type = string.lower(h:get("content-type") or "")
        if string.find(content_type, "^%s*application/x%-www%-form%-urlencoded") or string.find(content_type, "^%s*multipart/") then
          handle:respond({[":status"] = "415"}, "")
          return
        end
        local length = h:get("content-length")
        if not length then
          handle:respond({[":status"] = "411"}, "")
          return
        end
        if not string.match(length, "^%d+$") then
          handle:respond({[":status"] = "400"}, "")
          return
        end
        if #length > 10 or tonumber(length) > 2147483648 then
          handle:respond({[":status"] = "413"}, "")
        end
      end
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: member-app-body-limit
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: member-app
  requestBuffer:
    limit: 1Mi
