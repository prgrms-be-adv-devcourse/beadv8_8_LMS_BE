# 앱별 실행 설정. 구조 전환 제약은 docs/architecture/app-modules.md 참고.
# Flyway 이력·Modulith 발행 기록은 앱 스키마에 둔다. 기존 모놀리스 DB의 이력 전환은 별도 작업이다.
spring:
  application:
    name: member-app
  profiles:
    default: local
  mvc:
    formcontent:
      filter:
        enabled: false
  modulith:
    detection-strategy: explicitly-annotated
    events:
      jdbc:
        schema-initialization:
          enabled: true
        schema: member
      republish-outstanding-events-on-restart: true
      completion-mode: archive
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true
    default-schema: member
    schemas:
    - member
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s
  session:
    jdbc:
      initialize-schema: always
  task:
    scheduling:
      pool:
        size: 4
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${GOOGLE_CLIENT_ID}"
            client-secret: "${GOOGLE_CLIENT_SECRET}"
            scope: profile,email
            redirect-uri: "{baseUrl}/api/v1/members/login/oauth2/code/{registrationId}"
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
hapbang:
  scheduling:
    enabled: true
  storage:
    s3:
      region: ap-northeast-2
  internal-api:
    key: "${HAPBANG_INTERNAL_API_KEY:}"
  # JWT 발급 (#370). issuer는 Envoy Gateway JWT provider의 issuer와 같아야 한다.
  # 개인 키(PKCS#8 PEM)는 공개 레포라 환경 변수로만 받고, 비어 있으면 앱이 시작하지 않는다
  jwt:
    issuer: https://hapbang/member
    access-token-ttl: 15m
    private-key: "${JWT_PRIVATE_KEY:}"
  chzzk:
    client-id: "${CHZZK_CLIENT_ID}"
    client-secret: "${CHZZK_CLIENT_SECRET}"
    redirect-uri: "${CHZZK_REDIRECT_URI}"
springdoc:
  swagger-ui:
    csrf:
      enabled: true
