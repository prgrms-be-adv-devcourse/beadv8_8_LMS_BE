# 앱별 실행 설정. 구조 전환 제약은 docs/architecture/app-modules.md 참고.
# Flyway 이력·Modulith 발행 기록은 앱 스키마에 둔다. 기존 모놀리스 DB의 이력 전환은 별도 작업이다.
spring:
  application:
    name: member-app
  # 가입 이메일 인증 코드 발송 (#557). Gmail SMTP(STARTTLS). 계정·앱 비밀번호는 프로필별 설정(운영은 Secret)에서 넣는다.
  # 계정이 없으면(로컬·테스트) 메일 대신 로그로 코드를 남기는 발송기를 쓴다 (LoggingEmailSender, 운영에서는 만들지 않음)
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  config:
    import:
    - classpath:member.yml
    - classpath:swagger.yml
  profiles:
    default: local
  mvc:
    formcontent:
      filter:
        enabled: false
  modulith:
    detection-strategy: explicitly-annotated
    events:
      jdbc:
        schema-initialization:
          enabled: true
        schema: member
      republish-outstanding-events-on-restart: true
      completion-mode: archive
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true
    default-schema: member
    schemas:
    - member
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s
  task:
    scheduling:
      pool:
        size: 4
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${GOOGLE_CLIENT_ID}"
            client-secret: "${GOOGLE_CLIENT_SECRET}"
            scope: profile,email
            redirect-uri: "{baseUrl}/api/v1/members/login/oauth2/code/{registrationId}"
management:
  health:
    # 메일 서버 연결은 헬스체크에 넣지 않는다 (#557). Gmail이 잠깐 안 돼도 회원 앱 전체가 준비 안 됨(readiness 실패)이 되면 안 된다
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      # 응답 시간 p50·p95·p99를 histogram_quantile로 계산할 bucket 경계(#617).
      # percentiles-histogram(기본 bucket 69개)보다 시리즈가 적도록 경계 10개만 직접 정한다
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1000ms,2500ms,5000ms
        # 진행 중 요청 수(http.server.requests.active)도 접두어가 같아 bucket이 붙으므로 빈 값으로 끈다
        http.server.requests.active: ""
  # trace(#579, #631). Envoy를 거친 요청은 Envoy가 traceparent flag로 넘긴 샘플링 결정을 따른다(Boot 기본 sampler가 parent-based).
  # 아래 비율은 배치처럼 앱 안에서 시작하는 trace에만 쓴다
  tracing:
    sampling:
      probability: 0.1
  opentelemetry:
    tracing:
      export:
        otlp:
          # Alloy는 OTLP gRPC(4317)만 받는다. endpoint는 k8s ConfigMap이 넣고, 없으면(로컬·테스트) 보내지 않는다
          transport: grpc
  otlp:
    metrics:
      export:
        # starter-opentelemetry가 함께 넣는 OTLP 지표 export를 끈다. 지표는 Prometheus가 /actuator/prometheus로 수집한다
        enabled: false
hapbang:
  scheduling:
    enabled: true
  # 회원 탈퇴 기능 스위치 (#593, 켬 #654). 켜면 시작할 때 지갑·출연·강의 Client 주소(hapbang.clients.*)와 연결 코드가 있어야 한다.
  # 꺼져 있으면 탈퇴 API는 404이고 꼬인 탈퇴 정리 배치도 돌지 않는다
  member:
    withdrawal:
      enabled: true
    # Kafka로 보내지 못한 회원 이벤트 재발행 (#421). 매분(member.batch.event-republish-cron) 실패한 기록만, 발행한 지
    # min-age가 지난 것을 batch-size건까지 다시 보낸다. 장애가 길어 밀리면 batch-size를 올린다
    event:
      republish-batch-size: 500
      republish-min-age: 1m
  storage:
    s3:
      region: ap-northeast-2
  internal-api:
    key: "${HAPBANG_INTERNAL_API_KEY:}"
  # 다른 앱 내부 API 주소. 출연은 받은 리뷰 목록(#555)과 탈퇴 확인(#654), 강의는 탈퇴 확인, 지갑은 탈퇴 닫기·다시 열기(#654)
  clients:
    appearance:
      base-url: "${APPEARANCE_API_BASE_URL}"
    lecture:
      base-url: "${LECTURE_API_BASE_URL}"
    billing:
      base-url: "${BILLING_API_BASE_URL}"
  # 구글 로그인 성공 뒤 보낼 프론트 주소 (#370)
  auth:
    login-success-url: /
  # JWT 발급 (#370). issuer는 Envoy SecurityPolicy의 JWT provider issuer, chat-app의 STOMP 검증 issuer와 같아야 한다.
  # 어긋나면 모든 토큰이 401이다. 기본값은 base manifest(로컬·k3d)의 SecurityPolicy issuer와 같은 자리 표시 값이고,
  # 운영은 member prod overlay가 HAPBANG_JWT_ISSUER로 앱 6개 prod overlay의 SecurityPolicy issuer와 같은 값을 넣는다.
  # CI가 두 값이 같은지 검사한다 (#500).
  # 개인 키(PKCS#8 PEM)는 공개 레포라 환경 변수로만 받고, 비어 있으면 앱이 시작하지 않는다
  jwt:
    issuer: "${HAPBANG_JWT_ISSUER:https://gateway.invalid}"
    access-token-ttl: 15m
    private-key: "${JWT_PRIVATE_KEY:}"
    # refresh token은 Redis에 해시로 저장한다. reuse-grace 안에 회전된 토큰이 다시 오면 재사용으로 보지 않는다 (여러 탭 동시 재발급)
    refresh-token:
      ttl: 14d
      reuse-grace: 10s
  chzzk:
    client-id: "${CHZZK_CLIENT_ID}"
    client-secret: "${CHZZK_CLIENT_SECRET}"
    redirect-uri: "${CHZZK_REDIRECT_URI}"
