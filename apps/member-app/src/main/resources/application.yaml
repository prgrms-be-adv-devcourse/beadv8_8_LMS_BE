# 앱별 실행 설정. 구조 전환 제약은 docs/architecture/app-modules.md 참고.
# Flyway 이력·Modulith 발행 기록은 앱 스키마에 둔다. 기존 모놀리스 DB의 이력 전환은 별도 작업이다.
spring:
  application:
    name: member-app
  config:
    import:
    - classpath:member.yml
    - classpath:swagger.yml
  profiles:
    default: local
  mvc:
    formcontent:
      filter:
        enabled: false
  modulith:
    detection-strategy: explicitly-annotated
    events:
      jdbc:
        schema-initialization:
          enabled: true
        schema: member
      republish-outstanding-events-on-restart: true
      completion-mode: archive
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true
    default-schema: member
    schemas:
    - member
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s
  task:
    scheduling:
      pool:
        size: 4
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${GOOGLE_CLIENT_ID}"
            client-secret: "${GOOGLE_CLIENT_SECRET}"
            scope: profile,email
            redirect-uri: "{baseUrl}/api/v1/members/login/oauth2/code/{registrationId}"
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      # 응답 시간 p50·p95·p99를 histogram_quantile로 계산할 bucket 경계(#617).
      # percentiles-histogram(기본 bucket 69개)보다 시리즈가 적도록 경계 10개만 직접 정한다
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1000ms,2500ms,5000ms
        # 진행 중 요청 수(http.server.requests.active)도 접두어가 같아 bucket이 붙으므로 빈 값으로 끈다
        http.server.requests.active: ""
hapbang:
  scheduling:
    enabled: true
  # 회원 탈퇴 기능 스위치 (#593). 지갑·출연·강의의 탈퇴 내부 API(docs/api/internal-withdrawals.md)와 회원 쪽 연결 코드가
  # 준비되면 켠다. 꺼져 있으면 탈퇴 API는 404이고 꼬인 탈퇴 정리 배치도 돌지 않는다
  member:
    withdrawal:
      enabled: false
    # Kafka로 보내지 못한 회원 이벤트 재발행 (#421). 매분(member.batch.event-republish-cron) 실패한 기록만, 발행한 지
    # min-age가 지난 것을 batch-size건까지 다시 보낸다. 장애가 길어 밀리면 batch-size를 올린다
    event:
      republish-batch-size: 500
      republish-min-age: 1m
  storage:
    s3:
      region: ap-northeast-2
  internal-api:
    key: "${HAPBANG_INTERNAL_API_KEY:}"
  # 받은 출연 리뷰 목록은 출연 내부 API로 읽는다 (#555, shared AppearanceApiClient)
  clients:
    appearance:
      base-url: "${APPEARANCE_API_BASE_URL}"
  # 구글 로그인 성공 뒤 보낼 프론트 주소 (#370)
  auth:
    login-success-url: /
  # JWT 발급 (#370). issuer는 Envoy SecurityPolicy의 JWT provider issuer, chat-app의 STOMP 검증 issuer와 같아야 한다.
  # 어긋나면 모든 토큰이 401이다. 기본값은 base manifest(로컬·k3d)의 SecurityPolicy issuer와 같은 자리 표시 값이고,
  # 운영은 member prod overlay가 HAPBANG_JWT_ISSUER로 앱 6개 prod overlay의 SecurityPolicy issuer와 같은 값을 넣는다.
  # CI가 두 값이 같은지 검사한다 (#500).
  # 개인 키(PKCS#8 PEM)는 공개 레포라 환경 변수로만 받고, 비어 있으면 앱이 시작하지 않는다
  jwt:
    issuer: "${HAPBANG_JWT_ISSUER:https://gateway.invalid}"
    access-token-ttl: 15m
    private-key: "${JWT_PRIVATE_KEY:}"
    # refresh token은 Redis에 해시로 저장한다. reuse-grace 안에 회전된 토큰이 다시 오면 재사용으로 보지 않는다 (여러 탭 동시 재발급)
    refresh-token:
      ttl: 14d
      reuse-grace: 10s
  chzzk:
    client-id: "${CHZZK_CLIENT_ID}"
    client-secret: "${CHZZK_CLIENT_SECRET}"
    redirect-uri: "${CHZZK_REDIRECT_URI}"
