# 앱별 실행 설정. 구조 전환 제약은 docs/architecture/app-modules.md 참고.
spring:
  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
hapbang:
  local-login:
    enabled: true
  storage:
    s3:
      bucket: "${S3_BUCKET}"
      key-prefix: dev
server:
  forward-headers-strategy: native
springdoc:
  swagger-ui:
    path: "/swagger-ui.html"
