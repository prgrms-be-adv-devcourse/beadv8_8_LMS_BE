# 앱별 실행 설정. 구조 전환 제약은 docs/architecture/app-modules.md 참고.
spring:
  # 가입 이메일 인증 메일 계정 (#557). 기본값이 없어 Secret에 없으면 앱이 시작하지 않는다
  mail:
    username: "${MAIL_USERNAME}"
    password: "${MAIL_PASSWORD}"
  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
hapbang:
  storage:
    s3:
      bucket: "${S3_BUCKET}"
      key-prefix: prod
server:
  forward-headers-strategy: native
