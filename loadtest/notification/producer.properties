# B0 이벤트 투입용 kafka-console-producer 설정(N13). b0.sh와 B0ConsoleProducerCompatibilityTest(G8)가 같은 파일을 쓴다.
# 브로커 기록이 끝나야 성공으로 보고(acks=all), 재시도해도 중복·순서 뒤바뀜이 없게 한다(idempotence, in-flight 1).
# key가 있으면 내장 파티셔너(toPositive(murmur2) % 파티션 수)를 쓴다. 발행 앱도 파티셔너를 설정하지 않는다(N13 확인).
acks=all
enable.idempotence=true
max.in.flight.requests.per.connection=1
partitioner.ignore.keys=false
