# B0 전용 로컬 k3d cluster(N13). 운영 node 구성을 흉내 낸다: server = core-data(PostgreSQL·Kafka·Redis·auxiliary-app),
# agent = app-observe(이번에는 비어 있음). context 이름은 k3d-hapbang-b0이고 b0.sh가 이 이름만 허용한다.
# 운영 limit(앱 704Mi)은 manifest가 정하고, node 메모리는 노트북 여유에 맞춰 k8s/local/k3d.yaml보다 작게 둔다.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: hapbang-b0
servers: 1
agents: 1
image: rancher/k3s:v1.36.5-k3s1
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
    nodeLabels:
      - label: hapbang.io/pool=core-data
        nodeFilters:
          - server:*
      - label: hapbang.io/pool=app-observe
        nodeFilters:
          - agent:*
  runtime:
    serversMemory: 5000m
    agentsMemory: 1500m
