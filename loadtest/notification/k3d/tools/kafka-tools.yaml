# B0 Kafka 도구 pod(N13, ND-165). 투입(console producer)·덤프(console consumer)·토픽·group 관리를 broker 컨테이너 밖에서 돌린다.
# broker 컨테이너 메모리 한도(700Mi, 운영과 같음) 안에서 도구 JVM을 함께 돌리면 OOMKilled가 났다(2026-11-15 B0 1회차).
# broker와 같은 이미지·버전(apache/kafka:4.4.0)을 써서 G8 호환 시험의 전제(도구 버전)를 그대로 둔다.
# 이전과 같은 노드(core-data)에 두어 CPU 조건을 바꾸지 않는다. kafka Service selector(app.kubernetes.io/name=kafka)와 겹치지 않는 label을 쓴다.
apiVersion: v1
kind: Pod
metadata:
  name: b0-kafka-tools
  namespace: hapbang-platform
  labels:
    app.kubernetes.io/name: b0-kafka-tools
spec:
  restartPolicy: Always
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: hapbang.io/pool
                operator: In
                values: [core-data]
  containers:
    - name: tools
      image: apache/kafka:4.4.0
      command: ["sleep", "infinity"]
      env:
        - name: KAFKA_HEAP_OPTS
          value: "-Xms32m -Xmx256m"
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
