# B0 격리 환경의 auxiliary-app(N13, ND-155). local overlay(로컬 이미지·가짜 Secret) 위에 B0 전용 값만 더한다.
# - 운영과 같게 둔다: limit 832Mi(#996. N13·N15 측정 때는 704Mi), JAVA_TOOL_OPTIONS -Xmx256m, replicas 1, prod 프로필.
# - 회원 앱이 없으므로 첫 Backfill 없이 알림 소비자를 바로 시작한다(user-backfill.on-startup=false).
# - 알림 시작 시각을 고정한다(첫 기동 기록에 기대지 않음, ND-095).
# - Gateway CRD(Envoy)와 Alloy가 없으므로 HTTPRoute·SecurityPolicy·BackendTrafficPolicy를 빼고 trace 전송을 끈다.
#   측정은 port-forward로 하므로 NetworkPolicy도 뺀다(운영과 다른 점, 결과 문서 "조건"에 적는다).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hapbang-prod
resources:
  - ../../../../apps/auxiliary-app/k8s/overlays/local
configMapGenerator:
  - name: auxiliary-app-config
    behavior: merge
    literals:
      - HAPBANG_NOTIFICATION_USER_BACKFILL_ON_STARTUP=false
      - HAPBANG_NOTIFICATION_ALERT_START_AT=2026-01-01T00:00:00Z
      - MANAGEMENT_TRACING_EXPORT_ENABLED=false
      - MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=false
patches:
  - patch: |-
      $patch: delete
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: auxiliary-app
  - patch: |-
      $patch: delete
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: auxiliary-app-stream
  - patch: |-
      $patch: delete
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: auxiliary-app-notification-websocket
  - patch: |-
      $patch: delete
      apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: SecurityPolicy
      metadata:
        name: auxiliary-app
  - patch: |-
      $patch: delete
      apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: BackendTrafficPolicy
      metadata:
        name: auxiliary-app-notification-websocket
  - patch: |-
      $patch: delete
      apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: BackendTrafficPolicy
      metadata:
        name: auxiliary-app-body-limit
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: auxiliary-app
