# 출연 모듈 테스트 전용 설정. src/test 아래라 배포 jar에는 포함되지 않는다.
spring:
  config:
    # 테스트에는 apps 모듈이 없으므로, 전역 application.yaml처럼 출연 설정 파일을 직접 읽는다.
    import: classpath:appearance.yml
  jpa:
    properties:
      hibernate:
        # 테스트 DB(create-drop)에 appearances 스키마를 만든다.
        # TODO(db): 운영 스키마 생성 방식이 정해지면 테스트도 같은 방식(마이그레이션 등)으로 맞춘다.
        hbm2ddl:
          create_namespaces: true
