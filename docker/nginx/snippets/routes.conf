# 운영·개발 공통 경로 규칙. $web_upstream, $app_upstream은 server 블록에서 지정한다.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

# 파일 본문 업로드. 모든 모듈 공통 규칙: PUT /api/v1/{모듈}/files/{id}/content (docs/deploy/s3.md)
# regex location이라 아래 /api/(prefix)보다 먼저 고른다. 나머지 /api/ 요청은 기본 상한(1MB)을 그대로 둔다.
# - 상한은 강의 영상 최대 크기(2GB)와 같다. 넘으면 nginx가 413으로 끊는다.
# - 본문을 디스크에 쌓지 않고 받는 대로 앱에 넘긴다. 앱이 S3로 스트리밍한다.
# - client_body_timeout·proxy_send_timeout·proxy_read_timeout(기본 60s)은 전체 시간이 아니라 읽기·쓰기 사이 간격이라 긴 업로드도 기본값으로 된다.
# - proxy_set_header가 없으므로 위쪽 공통 헤더를 상속한다.
location ~ ^/api/v1/[a-z-]+/files/[0-9]+/content$ {
    client_max_body_size 2g;
    proxy_request_buffering off;
    proxy_pass http://$app_upstream:8080;
}

# API (WebSocket 포함)
# location에 proxy_set_header가 하나라도 있으면 위쪽 공통 헤더를 상속하지 않으므로 다시 적는다.
location /api/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://$app_upstream:8080;
}

# API 명세. 운영은 앱에서 꺼져 있어 404가 된다.
location /swagger-ui {
    proxy_pass http://$app_upstream:8080;
}

location /v3/api-docs {
    proxy_pass http://$app_upstream:8080;
}

# 나머지는 프론트(정적 파일)
location / {
    proxy_pass http://$web_upstream:80;
}
