# 운영·개발 공통 TLS 설정. 인증서 하나에 두 도메인이 들어 있다(certbot --cert-name hapbang).

ssl_certificate     /etc/letsencrypt/live/hapbang/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/hapbang/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# 브라우저가 이후 이 도메인을 HTTPS로만 접속하게 한다.
add_header Strict-Transport-Security "max-age=31536000" always;
