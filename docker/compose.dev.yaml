# 개발 서버(EC2) 배포용. 운영(compose.prod.yaml)과 같은 EC2에 함께 올린다.
# 서버에서는 deploy.sh가 실행한다. 비밀값은 레포 밖 /opt/hapbang/env/dev.env에 둔다(.env.example 참고).
# 운영과 컨테이너·네트워크·볼륨(DB)이 섞이지 않도록 프로젝트 이름을 분리한다.
# 외부 포트는 열지 않는다. 요청은 edge(compose.edge.yaml)가 hapbang-edge 네트워크로 전달한다.
name: hapbang-dev

# 로그가 디스크(50GB)를 채우지 않도록 컨테이너별 로그 크기를 제한한다.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # React 정적 파일 서빙만 한다. 이미지는 FE 레포에서 만든다.
  web:
    image: ghcr.io/prgrms-be-adv-devcourse/beadv8_8_lms_fe:${FE_TAG:-dev}
    networks:
      edge:
        aliases: [dev-web]
    restart: unless-stopped
    logging: *logging

  # 운영이 메모리를 뺏기지 않도록 개발 컨테이너는 메모리 상한을 둔다.
  app:
    image: ghcr.io/prgrms-be-adv-devcourse/beadv8_8_lms_be:${BE_TAG:-dev}
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB가 필요하다}
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER가 필요하다}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 필요하다}
      # 컨테이너 메모리 상한 기준으로 힙을 잡는다(기본값 25%는 너무 작다).
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    mem_limit: 1g
    networks:
      default:
      edge:
        aliases: [dev-app]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # 운영 DB와 별도 인스턴스다. 외부와 edge에 노출하지 않는다.
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

networks:
  edge:
    name: hapbang-edge
    external: true

volumes:
  postgres-data:
