# 개발 서버(EC2) 배포용. 운영(compose.prod.yaml)과 같은 EC2에 함께 올린다.
# 서버에서는 deploy.sh가 실행한다. 비밀값은 레포 밖 /opt/hapbang/env/dev.env에 둔다(.env.example 참고).
# 운영과 컨테이너·네트워크·볼륨(DB)이 섞이지 않도록 프로젝트 이름을 분리한다.
# 외부 포트는 열지 않는다(postgres만 서버 내부 127.0.0.1에 연다). 요청은 edge(compose.edge.yaml)가 hapbang-edge 네트워크로 전달한다.
name: hapbang-dev

# 로그가 디스크(50GB)를 채우지 않도록 컨테이너별 로그 크기를 제한한다.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # React 정적 파일 서빙만 한다. 이미지는 FE 레포에서 만든다.
  web:
    image: ghcr.io/prgrms-be-adv-devcourse/beadv8_8_lms_fe:${FE_TAG:-dev}
    environment:
      TZ: Asia/Seoul
    networks:
      edge:
        aliases: [dev-web]
    # 정적 파일 응답 확인. 배포(deploy.sh)의 --wait가 healthy를 기다린다.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging: *logging

  # 운영이 메모리·CPU를 뺏기지 않도록 개발 컨테이너는 상한을 둔다(t3.large는 vCPU 2개).
  app:
    image: ghcr.io/prgrms-be-adv-devcourse/beadv8_8_lms_be:${BE_TAG:-dev}
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TZ: Asia/Seoul
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB가 필요하다}
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER가 필요하다}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 필요하다}
      # 컨테이너 메모리 상한 기준으로 힙을 잡는다(기본값 25%는 너무 작다).
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    mem_limit: 1g
    cpus: 1.0
    networks:
      default:
      edge:
        aliases: [dev-app]
    # Spring Boot는 컨텍스트 초기화가 끝난 뒤 8080을 연다. 포트가 열리면 준비된 것으로 본다.
    # 배포(deploy.sh)의 --wait가 healthy를 기다리고, 실패하면 이전 이미지로 롤백한다.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # 운영 DB와 별도 인스턴스다. 외부와 edge에 노출하지 않고 서버 내부(SSH 터널)에서만 접근한다.
  postgres:
    image: postgres:18
    # DB 세션·로그 시간대를 KST로 고정한다(이미 초기화된 DB에도 적용된다).
    command: ["postgres", "-c", "timezone=Asia/Seoul", "-c", "log_timezone=Asia/Seoul"]
    # DB 클라이언트(DataGrip 등)용. 서버 자신(127.0.0.1)에만 열어 SSH 터널로만 접근할 수 있다.
    ports:
      - "127.0.0.1:15433:5432"
    environment:
      TZ: Asia/Seoul
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

networks:
  edge:
    name: hapbang-edge
    external: true

volumes:
  postgres-data:
