# main → 운영(prod), dev → 개발 서버(dev)로 배포한다. ci.yml이 통과해야 배포 단계로 넘어간다.
# ci: 테스트하고 jar를 만든다(ci.yml 재사용, 읽기 권한).
# build: ci가 테스트한 jar를 이미지에 담아 GHCR에 올린다(packages: write는 이 job에만).
# deploy: 배포 전용 SSH 키로 EC2의 deploy.sh를 실행한다. 서버에서는 app 컨테이너만 교체된다.
#         GHCR이 private이므로 이 job의 읽기 전용 GITHUB_TOKEN(job 종료 시 만료)을 stdin으로 넘겨 pull에만 쓴다.
# 필요한 Secrets: DEPLOY_HOST, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS (docker/README.md 참고)
name: Deploy

on:
  push:
    branches: [main, dev]

# 같은 브랜치의 배포는 순서대로 실행한다.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/prgrms-be-adv-devcourse/beadv8_8_lms_be

jobs:
  # 테스트를 통과한 커밋만 배포한다(ci.yml 재사용). 테스트한 jar를 artifact(app-jar)로 넘겨받는다.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      upload-jar: true

  build:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      env: ${{ steps.target.outputs.env }}
    steps:
      # docker/Dockerfile을 쓰기 위해 받는다. 소스는 빌드하지 않는다.
      - uses: actions/checkout@v7

      - name: 배포 대상 결정
        id: target
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"; echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"; echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: 테스트한 jar 받기
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: apps/build/libs

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest|:dev는 배포용, :sha-<커밋>은 롤백용(서버 env에 BE_TAG로 고정)
      - uses: docker/build-push-action@v7
        with:
          context: apps/build/libs
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.target.outputs.tag }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}

  # 서버로 넘어가는 토큰이 쓰기 권한을 갖지 않도록 build와 job을 분리한다.
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      # 서버 설정(docker/)이 레포와 같은지 비교하는 데 쓴다.
      # 이 run의 커밋이 아니라 브랜치 최신과 비교한다. 이전 run을 다시 실행하는 롤백은 그 사이 바뀐 설정에 막히지 않는다.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: EC2 배포
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_ENV: ${{ needs.build.outputs.env }}
        run: |
          # 서버·Secrets 준비 전에는 이미지 push까지만 하고 배포는 건너뛴다.
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::warning::DEPLOY_HOST Secret이 없어 EC2 배포를 건너뜁니다."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          deploy_ssh() { ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "deploy@$DEPLOY_HOST" "$@"; }

          # 1) 배포 전에 서버 설정이 레포와 같은지 확인한다(서버 설정은 수동 반영, docs/deploy/operations.md "설정 반영").
          #    이번 환경의 compose가 다르면 배포하지 않는다.
          #    나머지(다른 환경 compose·edge·nginx·deploy.sh)는 브랜치마다 반영 시점이 달라 경고만 한다.
          config=$(deploy_ssh "$TARGET_ENV check" < /dev/null) || {
            echo "::error::서버 설정 확인에 실패했습니다. 서버의 deploy.sh가 최신(check 지원)인지 확인하세요('설정 반영')."
            exit 1
          }
          mismatch=0
          while read -r _ sum file; do
            [ "$sum" = "$(sha256sum "docker/$file" | cut -d' ' -f1)" ] && continue
            if [ "$file" = "compose.$TARGET_ENV.yaml" ]; then
              echo "::error::서버의 $file 가 레포($GITHUB_REF_NAME)와 달라 배포하지 않습니다. '설정 반영' 후 이 job을 다시 실행하세요."
              mismatch=1
            else
              echo "::warning::서버의 $file 가 레포($GITHUB_REF_NAME)와 다릅니다. '설정 반영'으로 서버에 반영하세요."
            fi
          done < <(grep '^\[config\]' <<< "$config" || true)
          [ "$mismatch" = 0 ] || exit 1

          # 2) 이 run의 커밋 이미지(:sha-<SHA>)를 배포한다. 이전 run의 deploy job을 다시 실행하면 롤백된다.
          printf '%s %s\n' "$GITHUB_ACTOR" "$GHCR_TOKEN" | deploy_ssh "$TARGET_ENV app $GITHUB_SHA"
