# main·dev 병합 시 테스트를 통과한 커밋의 이미지를 만든다. ci.yml이 통과해야 이미지를 만든다.
# dev는 개발 서버(dev)에 바로 배포한다. main은 이미지까지만 만들고, 운영(prod) 배포는 deploy-prod.yml을 수동으로 실행한다.
# ci: 테스트하고 jar를 만든다(ci.yml 재사용, 읽기 권한).
# build: ci가 테스트한 jar를 이미지에 담아 GHCR에 올린다(packages: write는 이 job에만).
# deploy: (dev만) deploy-server.yml로 EC2에 배포한다.
name: Deploy

on:
  push:
    branches: [main, dev]

# 같은 브랜치의 배포는 순서대로 실행한다.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/prgrms-be-adv-devcourse/beadv8_8_lms_be

jobs:
  # 테스트를 통과한 커밋만 배포한다(ci.yml 재사용). 테스트한 jar를 artifact(app-jar)로 넘겨받는다.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      upload-jar: true

  build:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # docker/Dockerfile을 쓰기 위해 받는다. 소스는 빌드하지 않는다.
      - uses: actions/checkout@v7

      - name: 이미지 태그 결정
        id: target
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: 테스트한 jar 받기
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: apps/build/libs

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest|:dev는 각 브랜치의 최신 빌드, :sha-<커밋>은 배포·롤백용(deploy.sh가 BE_TAG로 고정)
      - uses: docker/build-push-action@v7
        with:
          context: apps/build/libs
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.target.outputs.tag }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}

  # 서버로 넘어가는 토큰이 쓰기 권한을 갖지 않도록 build와 job을 분리한다.
  # main은 여기서 배포하지 않는다(운영 배포는 deploy-prod.yml). dev는 이전 run의 deploy job을 다시 실행하면 그 버전으로 롤백된다.
  deploy:
    needs: build
    if: github.ref_name == 'dev'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-server.yml
    with:
      env: dev
      sha: ${{ github.sha }}
      config-ref: dev
    secrets: inherit
