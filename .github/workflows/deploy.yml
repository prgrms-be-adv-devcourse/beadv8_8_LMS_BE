# 운영(prod) k3s 앱 배포·롤백(#374, #559). 서버는 prod 한 벌이고 dev 커밋을 배포한다. main에는 서버가 없다.
# - 자동: dev push마다 publish.yml이 이미지를 발행한 뒤 이 workflow를 그 커밋으로 호출한다(workflow_call).
#   그때 dev 최신 커밋이 아니면 건너뛴다. 뒤 push의 run이 그 커밋까지 포함해 배포하므로, 앞 커밋으로 되돌리지 않는다.
# - 수동: Actions → Deploy → Run workflow(브랜치 dev), 또는 gh workflow run deploy.yml --ref dev [-f sha=…] [-f apps=…].
#   18시 이후처럼 서버가 꺼져 자동 배포가 실패한 뒤 따라잡거나 롤백할 때 쓴다.
# 이미지는 publish.yml이 :sha-<그 앱을 마지막으로 바꾼 dev 커밋>으로 올린다. 이 workflow는 이미지를 만들지 않는다.
# - sha: 배포할 dev 커밋. 비우면 dev 최신이다. 앱마다 이 커밋 시점의 그 앱 이미지를 쓴다(.github/scripts/apps.sh source).
# - apps: 비우면 클러스터에서 지금 도는 이미지와 비교해 바뀐 앱만 배포한다. 적으면 그 앱만 배포한다(수동만).
#   롤백은 apps에 앱을, sha에 되돌릴 dev 커밋을 넣는다.
# 앱은 apps.sh 순서대로 하나씩 apply → rollout status 한다. 실패하면 그 앱만 rollout undo하고, 남은 앱은 배포하지 않는다.
#
# 클러스터 접근: GitHub OIDC로 IAM role을 받아 SSM Run Command로 large에서 kubectl을 실행한다(6443·SSH를 쓰지 않는다).
#   role의 trust는 environment prod job만 허용하고, prod environment는 dev 브랜치만 허용한다.
#   prod environment Secrets: AWS_DEPLOY_ROLE_ARN(role ARN), DEPLOY_INSTANCE_ID(large 인스턴스 ID)
# 공개 레포라 로그도 공개다. node 이름·IP가 나오는 출력을 하지 않는다(.github/scripts/k3s-deploy.sh).
# GHCR은 조직 정책으로 private이다. 이 job의 GHCR 로그인(GITHUB_TOKEN)은 러너에서 이미지가 있는지 보는 데만 쓴다.
#   node는 hapbang-prod의 공유 Secret ghcr-pull(k8s/registry, 90일 PAT)로 이미지를 받는다. 토큰을 서버로 보내지 않는다(#461).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 배포할 dev 커밋 sha(7~40자). 비우면 dev 최신
        type: string
        required: false
      apps:
        description: 배포할 앱(공백 구분, 예 member-app chat-app). 비우면 바뀐 앱만 자동으로
        type: string
        required: false
  # publish.yml이 dev push마다 그 커밋으로 호출한다. apps는 넘기지 않는다(바뀐 앱만 자동으로).
  workflow_call:
    inputs:
      sha:
        description: 배포할 dev 커밋 sha(40자)
        type: string
        required: true
      apps:
        description: 배포할 앱(공백 구분). publish.yml은 비워 둔다
        type: string
        required: false
        default: ''
    # 호출될 때는 호출한 쪽(publish.yml)이 넘긴 secret만 보인다. 수동 실행은 Environment prod에서 바로 읽는다(#570).
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        required: true
      DEPLOY_INSTANCE_ID:
        required: true

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/prgrms-be-adv-devcourse/beadv8_8_lms_be

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: prod
    timeout-minutes: 90
    # 운영 배포는 한 번에 하나씩 순서대로 실행한다. 자동(publish.yml)과 수동 실행이 같은 group을 쓴다.
    # 호출된 workflow에서도 적용되도록 job에 둔다.
    # queue: max로 기다리는 run을 취소하지 않고 들어온 순서대로 실행한다. 기본값(single)은 기다리던 run을 새 run으로 바꾸는데,
    # 늦게 끝난 앞 커밋의 run이 dev 최신 run을 밀어내면 최신 커밋이 배포되지 않고, 기다리던 수동 롤백도 조용히 취소된다.
    # 앞 커밋의 run은 차례가 와도 dev 최신이 아니라 바로 건너뛴다(커밋 확인).
    concurrency:
      group: deploy-k3s-prod
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      # 러너에서 이미지가 GHCR에 있는지 확인한다(node의 pull 인증과 별개).
      packages: read
      # GitHub OIDC 토큰으로 AWS role을 받는다.
      id-token: write
    steps:
      # 입력값은 스크립트에 직접 넣지 않고 환경 변수로만 받는다(명령 주입 방지).
      - name: 입력 확인
        env:
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_APPS: ${{ inputs.apps }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/dev ]; then
            echo "::error::dev 브랜치에서 실행하세요(Run workflow → Use workflow from: dev). main에는 서버가 없습니다. 현재: $GITHUB_REF"
            exit 1
          fi
          if [ -n "$INPUT_SHA" ] && ! [[ "$INPUT_SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::sha는 소문자 16진수 7~40자여야 합니다."
            exit 1
          fi
          if ! [[ "$INPUT_APPS" =~ ^[a-z\ -]*$ ]]; then
            echo "::error::apps는 앱 이름을 공백으로 구분해 적습니다(예: member-app chat-app)."
            exit 1
          fi

      # 바뀐 앱 비교와 태그 결정에 dev 전체 이력이 필요하다. 받은 시점의 dev 최신이 HEAD가 된다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0

      - name: 커밋 확인
        id: commit
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha=$(git rev-parse --verify --quiet "${INPUT_SHA:-HEAD}^{commit}") || {
            echo "::error::커밋을 찾을 수 없거나 짧은 sha가 여러 커밋에 해당합니다: $INPUT_SHA"
            exit 1
          }
          if ! git merge-base --is-ancestor "$sha" HEAD; then
            echo "::error::dev에 포함되지 않은 커밋입니다: $sha"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # 자동 배포(push로 호출)는 dev 최신 커밋만 배포한다. 늦게 끝난 앞 run이 뒤 커밋의 배포를 되돌리지 않게 한다.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$sha" != "$(git rev-parse HEAD)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "dev 최신 커밋이 아니라 배포하지 않습니다: ${sha:0:7}(dev 최신 $(git rev-parse --short HEAD)). 뒤 push의 run이 배포합니다."
            {
              echo "### 운영 배포"
              echo "- 건너뜀: \`${sha:0:7}\`은 dev 최신 커밋이 아니다(dev 최신 \`$(git rev-parse --short HEAD)\`). 뒤 push의 run이 배포한다."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.commit.outputs.skip != 'true'
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: 지금 배포된 이미지 확인
        if: steps.commit.outputs.skip != 'true'
        env:
          INSTANCE_ID: ${{ secrets.DEPLOY_INSTANCE_ID }}
        # 기본 셸은 pipefail이 없어 파이프로 넘기면 실패가 가려진다. 파일로 받은 뒤 출력한다.
        run: |
          .github/scripts/ssm-run.sh .github/scripts/k3s-deploy.sh images > "$RUNNER_TEMP/current.txt"
          cat "$RUNNER_TEMP/current.txt"

      # plan.txt: 배포할 앱마다 "<앱> <태그 커밋> <지금 도는 태그 커밋|->"
      - name: 배포 대상 결정
        id: plan
        if: steps.commit.outputs.skip != 'true'
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          INPUT_APPS: ${{ inputs.apps }}
        run: |
          apps=$(.github/scripts/apps.sh list)
          for app in $INPUT_APPS; do
            grep -qx "$app" <<< "$apps" || { echo "::error::목록에 없는 앱입니다: $app"; exit 1; }
          done

          : > "$RUNNER_TEMP/plan.txt"
          for app in $apps; do
            image=$(awk -v a="$app" '$1 == a { print $2 }' "$RUNNER_TEMP/current.txt")
            running=${image##*:sha-}
            [[ "$running" =~ ^[0-9a-f]{40}$ ]] || running=

            if [ -n "$INPUT_APPS" ]; then
              tr ' ' '\n' <<< "$INPUT_APPS" | grep -qx "$app" || continue
            elif [ -n "$running" ] && ! .github/scripts/apps.sh changed "$running" "$SHA" | grep -qx "$app"; then
              continue
            fi
            echo "$app $(.github/scripts/apps.sh source "$app" "$SHA") ${running:--}" >> "$RUNNER_TEMP/plan.txt"
          done

          {
            echo "### 운영 배포"
            echo "- 커밋: \`$SHA\` $(git log -1 --format=%s "$SHA")"
            if [ -s "$RUNNER_TEMP/plan.txt" ]; then
              echo
              echo "| 앱 | 지금 | 배포 |"
              echo "| --- | --- | --- |"
              while read -r app tag running; do
                echo "| $app | \`${running:0:7}\` | \`${tag:0:7}\` |"
              done < "$RUNNER_TEMP/plan.txt"
            else
              echo "- 배포할 앱이 없습니다."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$RUNNER_TEMP/plan.txt" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/plan.txt"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.plan.outputs.deploy
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 하나라도 이미지가 없으면 아무 앱도 배포하지 않는다.
      - name: 이미지 확인
        if: steps.plan.outputs.deploy
        run: |
          missing=0
          while read -r app tag _; do
            if ! docker buildx imagetools inspect "$IMAGE_PREFIX/$app:sha-$tag" > /dev/null; then
              echo "::error::이미지 $IMAGE_PREFIX/$app:sha-$tag 가 없습니다. 그 커밋의 Publish and deploy run이 실패했거나 아직 진행 중입니다."
              missing=1
            fi
          done < "$RUNNER_TEMP/plan.txt"
          [ "$missing" = 0 ]

      - name: 배포
        if: steps.plan.outputs.deploy
        env:
          INSTANCE_ID: ${{ secrets.DEPLOY_INSTANCE_ID }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          while read -r app tag _; do
            echo "::group::$app → sha-${tag:0:7}"
            if ! .github/scripts/ssm-run.sh .github/scripts/k3s-deploy.sh apply "$app" "$SHA" "$tag" < /dev/null; then
              echo "::endgroup::"
              echo "::error::$app 배포에 실패했습니다(원인은 위 로그). 적용 뒤 실패면 그 앱을 되돌렸습니다. 뒤 순서의 앱은 배포하지 않았습니다."
              exit 1
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/plan.txt"
