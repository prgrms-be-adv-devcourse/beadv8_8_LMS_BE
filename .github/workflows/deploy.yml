# main·dev 병합 시 테스트를 통과한 커밋의 이미지를 만든다. ci.yml이 통과해야 이미지를 만든다.
# dev는 개발 서버(dev)에 바로 배포한다. main은 이미지까지만 만들고, 운영(prod) 배포는 deploy-prod.yml을 수동으로 실행한다.
# ci: 테스트하고 jar를 만든다(ci.yml 재사용, 읽기 권한).
# build: ci가 테스트한 jar를 이미지에 담아 GHCR에 올린다(packages: write는 이 job에만).
# deploy: (dev만) deploy-server.yml로 EC2에 배포한다.
#
# 일시 중지(#356): 단일 앱(apps/build/libs/app.jar, docker/Dockerfile)을 전제로 한 흐름이라 앱별 구조에서는 동작하지 않는다.
# 앱별 서비스 간 통신이 끝나기 전에는 새 앱으로 서버를 바꿀 수 없으므로(docs/architecture/app-modules.md),
# push 트리거를 빼고 dev 서버는 마지막으로 배포한 이미지를 유지한다. 앱별 배포로 다시 작성할 때 트리거를 되살린다.
# 아래 job은 다시 작성할 때 참고하도록 남긴다. ci.yml이 더는 workflow_call을 받지 않아 수동 실행하면 바로 실패한다.
# dev 롤백은 지금처럼 되돌릴 버전의 이전 Deploy run에서 deploy job만 다시 실행한다.
name: Deploy

on:
  workflow_dispatch:

# 같은 브랜치의 배포는 순서대로 실행한다.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/prgrms-be-adv-devcourse/beadv8_8_lms_be

jobs:
  # 테스트를 통과한 커밋만 배포한다(ci.yml 재사용). 테스트한 jar를 artifact(app-jar)로 넘겨받는다.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      upload-jar: true

  build:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # docker/Dockerfile을 쓰기 위해 받는다. 소스는 빌드하지 않는다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 이미지 태그 결정
        id: target
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: 테스트한 jar 받기
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-jar
          path: apps/build/libs

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest|:dev는 각 브랜치의 최신 빌드, :sha-<커밋>은 배포·롤백용(deploy.sh가 BE_TAG로 고정)
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/build/libs
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.target.outputs.tag }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}

  # 서버로 넘어가는 토큰이 쓰기 권한을 갖지 않도록 build와 job을 분리한다.
  # main은 여기서 배포하지 않는다(운영 배포는 deploy-prod.yml). dev는 이전 run의 deploy job을 다시 실행하면 그 버전으로 롤백된다.
  deploy:
    needs: build
    if: github.ref_name == 'dev'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-server.yml
    with:
      env: dev
      sha: ${{ github.sha }}
      config-ref: dev
    secrets: inherit
