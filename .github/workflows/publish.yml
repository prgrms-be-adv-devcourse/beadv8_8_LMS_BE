# dev push마다 이미지를 발행하고 운영(prod) k3s에 배포한다(#374, #559). 서버는 prod 한 벌이고 dev 병합이 곧 운영 반영이다.
# main은 서버가 없다. release/review-N → main 리뷰 제출용으로만 병합하고, main push에는 workflow가 돌지 않는다.
# images: 이 커밋에서 앱마다 쓸 이미지(:sha-<그 앱을 마지막으로 바꾼 커밋>, .github/scripts/apps.sh source)가 GHCR에 있는지 보고 없는 앱을 고른다.
#   이번 push에서 바뀐 앱은 태그가 새 커밋이라 항상 고른다. 앞 run이 실패했거나 아직 발행 중인 앱도 다시 고른다.
#   그래서 앞 run의 결과와 상관없이, 이 run이 성공하면 이 커밋의 모든 앱 이미지가 GHCR에 있다.
# ci: 고른 앱만 테스트하고 앱별 jar를 만든다(ci.yml 재사용, 읽기 권한).
# build: 고른 앱마다 ci가 테스트한 jar를 이미지에 담아 올린다(packages: write는 이 job에만).
# deploy: deploy.yml로 이 커밋을 배포한다. 그때 dev 최신 커밋이 아니면 건너뛴다(뒤 push의 run이 배포한다).
# 태그는 :sha-<커밋> 하나다. :latest 같은 움직이는 태그는 만들지 않는다.
name: Publish and deploy

on:
  push:
    branches: [dev]

# concurrency group을 두지 않는다. 발행은 run마다 따로 돌고, 배포는 deploy.yml의 job concurrency가 하나씩 실행한다.
# 연달아 들어온 push가 같은 앱 이미지를 함께 발행하면 같은 태그를 두 번 올린다. 같은 앱 내용을 테스트한 jar라 어느 쪽이 남아도 같다.

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/prgrms-be-adv-devcourse/beadv8_8_lms_be

jobs:
  images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # 이미지가 GHCR에 있는지만 본다.
      packages: read
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      # 앱을 마지막으로 바꾼 커밋을 찾으려면 전체 이력이 필요하다.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 조회가 실패하면(없음, 권한, 네트워크) 없는 것으로 보고 다시 발행한다. 권한 문제면 build의 push가 실패해 드러난다.
      - name: 발행할 앱 찾기
        id: detect
        run: |
          : > "$RUNNER_TEMP/apps.txt"
          for app in $(.github/scripts/apps.sh list); do
            tag=$(.github/scripts/apps.sh source "$app" "$GITHUB_SHA")
            if docker buildx imagetools inspect "$IMAGE_PREFIX/$app:sha-$tag" > /dev/null 2>&1; then
              echo "있음: $app sha-${tag:0:7}"
            else
              echo "없음: $app sha-${tag:0:7}"
              echo "$app" >> "$RUNNER_TEMP/apps.txt"
            fi
          done
          apps=$(jq -Rnc '[inputs | select(length > 0)]' < "$RUNNER_TEMP/apps.txt")
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          {
            echo "### 발행 대상"
            echo "- 커밋: \`${GITHUB_SHA:0:7}\`"
            echo "- 앱: $(jq -r 'if length == 0 then "없음(모든 앱 이미지가 이미 있다)" else join(", ") end' <<< "$apps")"
          } >> "$GITHUB_STEP_SUMMARY"

  # 테스트를 통과한 앱만 발행한다(ci.yml 재사용). 테스트한 jar를 앱별 artifact(app-jar-<앱>)로 넘겨받는다.
  ci:
    needs: images
    if: needs.images.outputs.apps != '[]'
    uses: ./.github/workflows/ci.yml
    with:
      upload-jar: true
      apps: ${{ needs.images.outputs.apps }}

  build:
    needs: [images, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      # 한 앱의 push가 실패해도 다른 앱은 올린다. 실패한 앱은 이 run을 다시 실행하거나 다음 push가 다시 발행한다.
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.images.outputs.apps) }}
    steps:
      # 앱의 Dockerfile과 태그를 정할 이력을 받는다. 소스는 빌드하지 않는다.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 태그는 push head가 아니라 이 앱을 마지막으로 바꾼 dev 커밋이다. 그 뒤로 앱 경로가 그대로이므로 head에서 만든 이미지와 내용이 같다.
      # 배포 workflow도 같은 명령(apps.sh source)으로 이미지를 찾는다.
      - name: 이미지 태그 결정
        id: tag
        env:
          APP: ${{ matrix.app }}
        run: echo "sha=$(.github/scripts/apps.sh source "$APP" "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      # artifact에는 app.jar 하나만 있다(ci.yml test job). 아래 빌드 컨텍스트 자리에 받는다.
      - name: 테스트한 jar 받기
        uses: actions/download-artifact@v8
        with:
          name: app-jar-${{ matrix.app }}
          path: apps/${{ matrix.app }}/build/libs

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :sha-<커밋>은 배포·롤백 때 고르는 태그다.
      - uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.app }}/build/libs
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:sha-${{ steps.tag.outputs.sha }}

  # 발행할 앱이 없으면 ci·build를 건너뛰고(skipped) 바로 배포한다. 앞 run이 dev 최신이 아니라 배포를 건너뛰었을 수 있어서다.
  # 테스트·발행이 실패하거나 취소되면 배포하지 않는다. needs가 실패하면 뒤 job은 skipped가 되므로 ci 결과도 함께 본다.
  deploy:
    needs: [images, ci, build]
    if: >-
      needs.images.result == 'success' && !cancelled() &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    uses: ./.github/workflows/deploy.yml
    # 호출된 workflow는 이 권한까지만 쓴다. id-token은 AWS role(OIDC), packages: read는 이미지 존재 확인에 쓴다.
    permissions:
      contents: read
      packages: read
      id-token: write
    with:
      sha: ${{ github.sha }}
